<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockPro | Ultimate 2026</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { 
            --bg: #0f0c15; --card: #1a1625; --text: #f0ebff; 
            --primary: #d4af37; --secondary: #38bdf8; --tertiary: #9d81ff; --danger: #ff4d4d; --accent: #2d2640;
        }
        body.light-mode { 
            --bg: #fdfdfd; --card: #ffffff; --text: #1a1a1a; --accent: #f0f0f0;
        }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; overflow-x: hidden; }
        nav { background: var(--card); padding: 15px 20px; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent); }
        .tab-box { display: flex; gap: 15px; align-items: center; }
        .tab { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; opacity: 0.5; cursor: pointer; padding: 5px 0; }
        .tab.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }
        .container { max-width: 500px; margin: 15px auto; padding: 0 15px; display: none; }
        .page { display: none; animation: fadeIn 0.4s ease; } 
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .btn { padding: 16px; border: none; cursor: pointer; border-radius: 10px; font-weight: 800; width: 100%; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-main { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: white; border-radius: 8px; width: 42px; height: 42px; border: none; }
        #qr-view { width: 100%; min-height: 280px; display: none; border-radius: 12px; margin-bottom: 15px; border: 3px solid var(--primary); background: #000; overflow: hidden; }
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; padding: 14px 28px; border-radius: 50px; display: none; font-weight: 900; z-index: 10001; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.9rem; }
        #pay-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .pay-card { background: #1a1a1a; width: 100%; max-width: 350px; border-radius: 24px; padding: 30px; text-align: center; border: 1px solid #333; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .mpesa-logo { width: 120px; margin-bottom: 20px; }
        .pay-amount { color: #25D366; font-size: 32px; margin: 10px 0; font-weight: 800; }
        .till-box { background: #252525; padding: 15px; border-radius: 12px; margin: 20px 0; border: 1px dashed #444; }
        .btn-confirm { width: 100%; padding: 16px; background: #25D366; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="dark-mode">

    <div id="auth-overlay" style="position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:var(--card); padding:30px; border-radius:20px; width:85%; max-width:340px; text-align:center; border:1px solid var(--primary);">
            <h2 style="color:var(--primary); margin:0;">STOCKPRO</h2>
            <p style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 20px;">Secure Inventory Management</p>
            <input type="text" id="u" placeholder="Enter Your Name">
            <input type="password" id="p" placeholder="Set Password">
            <select id="r_select" style="margin-bottom: 15px;">
                <option value="" disabled selected>Select Role</option>
                <option value="Admin">Admin</option>
                <option value="Staff">Staff</option>
            </select>
            <button class="btn btn-main" onclick="doLogin()">Unlock System</button>
        </div>
    </div>

    <nav id="navbar">
        <div style="font-weight:900; color:var(--primary)">STOCKPRO</div>
        <div class="tab-box">
            <div class="tab active" onclick="tab('dash', event)">Home</div>
            <div class="tab" onclick="tab('inv', event)">Ledger</div>
            <div class="tab" onclick="tab('rep', event)">Docs</div>
            <i class="fas fa-moon" id="mode-icon" onclick="toggleMode()" style="cursor:pointer; color:var(--primary); font-size: 1.3rem;"></i>
        </div>
    </nav>

    <div class="container" id="app">
        <section id="p-dash" class="page active">
            <div id="chart-card" class="card" style="display:none; height: 260px; text-align:center;">
                <canvas id="stockPie"></canvas>
            </div>
            <div class="card">
                <div id="qr-view"></div>
                <button id="scan-btn" class="btn" style="background:var(--accent); color:var(--text); margin-bottom:12px;" onclick="toggleScanner()">
                    <i class="fas fa-camera"></i> <span id="scan-text">Start Scanner</span>
                </button>
                <input id="n" placeholder="Item Name">
                <input id="q" type="number" placeholder="Quantity">
                <div id="adm-pr" style="display:none;"><input id="pr" type="number" placeholder="Price (KES)"></div>
                <select id="cat">
                    <option>Hardware</option>
                    <option>Software</option>
                    <option>Materials</option>
                </select>
                <button class="btn btn-main" onclick="add()">Commit Asset</button>
            </div>
        </section>

        <section id="p-inv" class="page">
            <div class="card">
                <input placeholder="Search assets..." onkeyup="draw()" id="find">
                <div id="table-body" style="margin-top: 10px; width:100%;"></div>
            </div>
        </section>

        <section id="p-rep" class="page">
            <div class="card" onclick="pdf()" style="cursor:pointer; display:flex; justify-content:space-between; margin-bottom:12px;">
                <span>Audit Report (PDF)</span> <i class="fas fa-file-pdf" style="color:var(--danger)"></i>
            </div>
            <div id="adm-csv" class="card" onclick="csv()" style="display:none; cursor:pointer; justify-content:space-between; margin-bottom:12px;">
                <span>Full Ledger (CSV)</span> <i class="fas fa-file-csv" style="color:var(--secondary)"></i>
            </div>
            <button class="btn" style="background:#25D366; color:white;" onclick="wa()">
                <i class="fab fa-whatsapp"></i> Sync to WhatsApp
            </button>
        </section>
    </div>

    <div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
        apiKey: "AIzaSyBAVRljN13EB1J8w4jJ3Qjk8iqjgxSqfAI",
        authDomain: "stockpro-9be18.firebaseapp.com",
        databaseURL: "https://stockpro-9be18-default-rtdb.firebaseio.com",
        projectId: "stockpro-9be18",
        storageBucket: "stockpro-9be18.firebasestorage.app",
        messagingSenderId: "1025574986774",
        appId: "1:1025574986774:web:78fb24039432c921b84137",
        measurementId: "G-PWNYV0Y8G7"
    };

    const app = initializeApp(firebaseConfig);
    const fdb = getDatabase(app);
    window.fdb = fdb; // Makes fdb visible to buttons
    const inventoryRef = ref(fdb);

    window.db = []; 
    window.role = ''; 
    window.userName = ''; 
    window.chart = null; 
    window.html5QrCode = null;

    // LOGIN & AUTH
    window.doLogin = function() {
        let name = document.getElementById('u').value.trim();
        let pass = document.getElementById('p').value.trim();
        let r = document.getElementById('r_select').value;
        if (!name || !pass || !r) return alert("Fill all fields!");
        window.userName = name;
        window.role = r;
        document.getElementById('auth-overlay').style.display='none';
        document.getElementById('navbar').style.display='flex';
        document.getElementById('app').style.display='block';
        if(r === 'Admin') {
            document.getElementById('adm-pr').style.display = 'block';
            document.getElementById('adm-csv').style.display = 'flex';
            document.getElementById('chart-card').style.display = 'block';
            setTimeout(initChart, 500);
        }
        draw(); 
        window.toast(`✅ Welcome ${name}`);
    };

    // NAVIGATION
    window.tab = function(p, e) {
        document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        e.currentTarget.classList.add('active');
        draw(); 
    };

    window.toggleMode = function() { document.body.classList.toggle('light-mode'); };

    
    // REAL-TIME CLOUD LISTENER (CRITICAL FOR LEDGER)
    onValue(inventoryRef, (snapshot) => {
        const data = snapshot.val();
        window.db = [];
        if (data) {
            Object.keys(data).forEach(id => {
                window.db.push({ ...data[id], firebaseId: id });
            });
        }
        draw(); // Automatically redraws Ledger when cloud updates
        if(window.chart) updateChart();
    });
window.draw = function() {
    try {
        let invData = window.db || [];
        let find = document.getElementById('find').value.toLowerCase();
        
        let filteredData = invData.filter(i => {
            if (!i || !i.name) return false;
            return i.name.toLowerCase().includes(find);
        });

        const listEl = document.getElementById('table-body');
        listEl.innerHTML = '';

        filteredData.forEach(i => {
            let s = (i.status || "unverified").toString().toLowerCase().trim();
            // 4 STAGES - Logic for Badge and Colors
        let isUnverified = s === "unverified" || s === "unpaid";
        let isPending = s === "pending";
        let isSubmitted = s === "submitted";
        let isVerified = s === "verified" || s === "paid";

        if (isUnverified) {
            invBadge = '<span style="color: #ff4d4d; font-size: 11px;">🚫 Awaiting Payment</span>';
            borderColor = '#ff4d4d';
        } else if (isPending) {
            invBadge = '<span style="color: #ffa500; font-size: 11px;">⌛ Pending Processing</span>';
            borderColor = '#ffa500';
        } else if (isSubmitted) {
            invBadge = '<span style="color: #facc15; font-size: 11px;">💰 Code Submitted</span>';
            borderColor = '#facc15';
        } else if (isVerified) {
            invBadge = '<span style="color: #4CAF50; font-size: 11px;">✅ PAID - Stock Verified</span>';
            borderColor = '#4CAF50';
        }

        // This ensures the M-Pesa code shows up under the item name
        let mpesaLine = i.mpesaCode ? `<div style="color: #0ea5e9; font-size: 10px; font-weight: 700; margin-top: 4px;">M-Pesa: ${i.mpesaCode}</div>` : "";
           
            let safeId = (i.firebaseId || '').replace(/'/g, "\\'");
            let safeName = (i.name || '').replace(/'/g, "\\'");
            let safePrice = i.price || 0;
            let safeQty = i.qty || 0;

            // ALL BUTTONS SHOW FOR EVERYONE
            let buttons = '';

        // 1. Show PAY button for anyone if item is Unpaid or Unverified
        if (s === "unpaid" || s === "unverified") {
            buttons += `<button class="btn" style="background:#2ecc71; color:white; margin-right:5px;" onclick="window.initPay('${i.id}', '${safePrice}', '${safeName}')">Pay</button>`;
        }

        // 2. Only show DELETE and VERIFY if you are the Admin
        if (window.role === 'Admin') {
            buttons += `<button class="btn" style="background:#ff4d4d; color:white; margin-right:5px;" onclick="window.deleteItem('${i.id}')">Delete</button>`;
            
            if (s === "submitted") {
                buttons += `<button class="btn" style="background:#3498db; color:white;" onclick="window.verifyPayment('${i.id}')">Verify</button>`;
            }
}

            listEl.innerHTML += `
            <div class="card" style="border-left: 5px solid ${borderColor}; position: relative; margin-bottom: 12px; padding: 15px; background: #fff; border-radius: 8px;">
                <div style="position: absolute; top: 10px; right: 12px;">${invBadge}</div>
                <div style="font-size: 15px; font-weight: 800; color: #1e293b;">
                    ${safeName}
                    ${mpesaLine} 
                </div>
                <div style="font-size: 13px; color: #64748b; margin-top: 8px;">
                    <span>${i.qty} PCS × KES ${safePrice}</span><br>
                    <span style="font-weight: 800; color: #22c55e;">Total: KES ${i.qty * safePrice}</span>
                </div>
                <div style="margin-top: 10px;">
                    ${buttons}
                </div>
            </div>`;   
            
        });

    } catch(e) {
        document.getElementById('table-body').innerHTML = `<div style="color:red; padding:20px;">DRAW ERROR: ${e.message}</div>`;
    }
};
        
    window.add = async function() {
    let n = document.getElementById('n').value.trim();
    let q = parseInt(document.getElementById('q').value);
    let p = document.getElementById('pr').value || 0;
    
    if(!n || isNaN(q) || q <= 0) return alert("Check name and quantity!");

    await push(inventoryRef, {
        name: n,
        qty: q,
        price: p,
        cat: document.getElementById('cat').value,
        status: "Unpaid", // Starts as Unpaid
        addedBy: window.userName,
        addedAt: new Date().toISOString()
    });

    window.toast("📦 Item added to list. Tap 'Pay' to submit code.");
    document.getElementById('n').value = '';
    document.getElementById('q').value = '';
    document.getElementById('pr').value = '';
};
    
    // M-PESA MODAL
    window.initPay = function(id, price, name) {
    const modal = document.createElement('div');
    modal.id = 'pay-modal-overlay';
    // This part ensures the modal is on top and visible
    modal.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; display:flex; align-items:center; justify-content:center;";
    
    modal.innerHTML = `
        <div class="pay-card" style="background:white; padding:20px; border-radius:12px; text-align:center; width:90%; max-width:350px; color: #333;">
            <h3 style="margin-top:0; color:#2ecc71;">Complete Payment</h3>
            <p style="font-size:14px;">Pay <b>KES ${price}</b> for ${name}</p>
            
            <div style="background:#f1f8f5; padding:15px; border:2px dashed #2ecc71; border-radius:8px; margin:15px 0;">
                <span style="font-size:10px; color:#666; letter-spacing:1px;">LIPA NA MPESA</span><br>
                <b style="font-size:20px; color:#2ecc71;">TILL: 5637180</b>
            </div>

            <input type="text" id="mpesa-code-input" placeholder="ENTER M-PESA CODE" 
                style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px; text-align:center; font-weight:bold; text-transform:uppercase;">
            
            <button class="btn" onclick="window.confirmPaid('${id}')" 
                style="background:#2ecc71; color:white; width:100%; padding:12px; font-weight:bold; border:none; border-radius:6px; cursor:pointer;">
                SUBMIT CODE
            </button>
            
            <button onclick="document.getElementById('pay-modal-overlay').remove()" 
                style="background:none; border:none; color:#888; margin-top:15px; cursor:pointer; font-size:13px;">
                CANCEL
            </button>
        </div>`;
    document.body.appendChild(modal);
};

window.confirmPaid = function(id) {
    const code = document.getElementById('mpesa-code').value.trim().toUpperCase();
    if (code.length < 5) return alert("Please enter a valid M-Pesa code");

    update(ref(fdb, 'inventory/' + id), {
        status: "Submitted",
        mpesaCode: code,
        submittedAt: new Date().toISOString()
    }).then(() => {
        alert("✅ Code submitted! Admin will verify shortly.");
        document.getElementById('pay-modal-overlay').remove();
    });
};
    window.confirmPaid = function(id) {
    // We must use 'mpesa-code-input' to match the modal I gave you
    const codeInput = document.getElementById('mpesa-code-input');
    
    if (!codeInput) {
        alert("ERROR: Can't find M-Pesa input box");
        return;
    }

    const code = codeInput.value.trim().toUpperCase();
    if (code.length < 5) return alert("Please enter a valid M-Pesa code");

    // This updates the status and saves the code to your database
    update(ref(fdb, 'inventory/' + id), {
        status: "Submitted",
        mpesaCode: code,
        submittedAt: new Date().toISOString()
    }).then(() => {
        window.toast("✅ Code submitted! Admin will verify.");
        const modal = document.getElementById('pay-modal-overlay');
        if (modal) modal.remove();
    }).catch(e => alert("Firebase Error: " + e.message));
};


    
    
    window.verifyStock = (id) => update(ref(fdb, id), { status: "Verified" });
window.del = (id) => confirm("Delete permanently?") && remove(ref(fdb, id));
    
    // STAGE 1→2: Only Admin can approve - stops hackers adding fake stock
window.approveItem = (id) => {
    if (window.role !== 'Admin') return alert("❌ Only Admin can approve stock. Tell Milka.");
    update(ref(fdb, id), { 
        status: "Pending",
        approvedBy: window.userName,
        approvedAt: new Date().toISOString()
    }).then(() => window.toast("✅ Stock approved. Ready for payment."));
};

// NEW: Proper modal for submitting M-Pesa code - works on mobile
window.openMpesaModal = function(id, name, total) {
    if (document.getElementById('mpesa-modal')) return; // prevent double
    
    const modal = document.createElement('div');
    modal.id = 'mpesa-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;';
    
    modal.innerHTML = `
        <div style="background:#1a1a1a;width:100%;max-width:340px;border-radius:20px;padding:25px;text-align:center;border:1px solid #25D366;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/M-PESA_LOGO-01.svg" style="width:100px;margin-bottom:15px;">
            <div style="color:#94a3b8;font-size:14px;">Payment for</div>
            <div style="color:white;font-weight:800;font-size:18px;margin:5px 0;">${name}</div>
            <div style="color:#25D366;font-size:28px;font-weight:800;margin:10px 0;">KES ${total}</div>
            <div style="background:#252525;padding:12px;border-radius:10px;margin:15px 0;border:1px dashed #444;">
                <div style="color:#888;font-size:11px;">TILL NUMBER</div>
                <div style="color:white;font-size:20px;font-weight:900;">5637180</div>
            </div>
            <input id="mpesa-code-input" type="text" placeholder="PASTE M-PESA CODE HERE" 
                style="width:100%;padding:14px;margin:10px 0;border:1px solid #444;background:#000;color:white;border-radius:10px;text-align:center;text-transform:uppercase;font-size:16px;box-sizing:border-box;">
            <button onclick="saveMpesaCode('${id}')" 
                style="width:100%;padding:16px;background:#25D366;color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px;">
                SUBMIT CODE TO ADMIN
            </button>
            <p onclick="document.getElementById('mpesa-modal').remove()" 
                style="cursor:pointer;color:#888;margin-top:15px;font-size:14px;">CANCEL</p>
        </div>`;
    document.body.appendChild(modal);
};

window.saveMpesaCode = function(id) {
    const codeInput = document.getElementById('mpesa-code-input');
    if (!codeInput) return alert("Error: Can't find input");

    const code = codeInput.value.trim().toUpperCase();
    if (code.length < 8) return alert("❌ Code too short. M-Pesa codes are 10 characters");

    update(ref(fdb, id), {
        status: "Submitted",
        mpesaCode: code,
        submittedBy: window.userName,
        submittedAt: new Date().toISOString()
    }).then(() => {
        window.toast("💰 Code sent to Admin for verification");
        document.getElementById('mpesa-modal').remove();
    }).catch(e => alert("❌ Firebase Error: " + e.message));
};

// STAGE 3-4: Only Admin can mark as PAID - you check code first
window.verifyPayment = (id) => {
    if (window.role !== 'Admin') return alert("❌ Only Admin can verify payment.");
    update(ref(fdb, id), {
        status: "Verified",
        verifiedBy: window.userName,
        verifiedAt: new Date().toISOString()
    }).then(() => window.toast("✅ PAID. Stock verified."));
};

// EXPORTS
window.pdf = function() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("StockPro Audit - 2026", 14, 15);
    const rows = window.db.map(i => [i.name, i.qty, i.cat, i.status]);
    doc.autoTable({ head: [['Item', 'Qty', 'Category', 'Status']], body: rows });
    doc.save('Stock_Audit.pdf');
};

window.csv = function() {
    let csv = "Item,Qty,Price,Status\n";
    window.db.forEach(i => csv += `${i.name},${i.qty},${i.price},${i.status}\n`);
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    link.download = "StockPro_Ledger.csv";
    link.click();
};

window.wa = function() {
    let msg = '*STOCKPRO CLOUD UPDATE*%0A';
    window.db.forEach(i => msg += ' • ' + `${i.name}: ${i.qty} (${i.status})%0A`);
    window.open('https://wa.me/254112873218?text=' + msg);
};

// SCANNER
window.toggleScanner = function() {
    const view = document.getElementById('qr-view');
    if (view.style.display === 'block') {
        window.html5QrCode.stop().then(() => { view.style.display = 'none'; });
    } else {
        view.style.display = 'block'; document.getElementById('scan-text').innerText = 'Scanning...';
        window.html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
            document.getElementById('n').value = text;
            window.toast("🔍 Item Identified");
            window.toggleScanner();
        });
    }
};

// CHART
function initChart() {
    const ctx = document.getElementById('stockPie').getContext('2d');
    window.chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['H/W', 'S/W', 'MAT'],
            datasets: [{ data: [0, 0, 0], backgroundColor: ["#d4af37", "#38bdf8", "#94a3b8"] }],
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
    updateChart();
}

function updateChart() {
    window.chart.data.datasets[0].data = ['Hardware', 'Software', 'Materials'].map(cat => window.db.filter(i => i.cat === cat).length);
    window.chart.update();
}

window.toast = (m) => {
    let t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
