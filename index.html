<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Inventory System</title>
    <style>
        /* 1. LOOKS ON SCREEN */
        body { background-color: #f1c40f; font-family: sans-serif; padding: 20px; margin: 0; }
        .dashboard { background-color: #2980b9; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .form-container { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .add-btn { background-color: #27ae60; color: white; }
        .print-btn { background-color: #34495e; color: white; margin-top: 15px; }
        .delete-btn { background-color: #e74c3c; color: white; padding: 5px; width: auto; }

        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; }

        /* 2. LOOKS ON PRINTED PAPER */
        @media print {
            body * { visibility: hidden; background: white !important; }
            #inventory-table, #inventory-table * { visibility: visible !important; }
            #inventory-table { position: absolute; left: 0; top: 0; width: 100%; border: 1px solid black !important; }
            th, td { border: 1px solid black !important; color: black !important; }
            button, .form-container, .dashboard { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>🍞 My Bakery Inventory</h1>
        <p>Keep track of your stock easily.</p>
    </div>

    <div class="form-container">
        <div class="welcome-section" style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #2980b9;">
    <h2>Welcome back, Milka! 👋</h2>
    <p>Manage your bakery stock for today.</p>
</div>

<div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <div style="flex: 1; background: #27ae60; color: white; padding: 15px; border-radius: 8px; text-align: center;">
        <small>Total Items</small>
        <h3 id="total-items-count">0</h3>
    </div>
    <div style="flex: 1; background: #e67e22; color: white; padding: 15px; border-radius: 8px; text-align: center;">
        <small>Stock Value</small>
        <h3 id="total-value-count">KES 0</h3>
    </div>
</div>
        <h3>Add New Product</h3>
        <input type="text" id="pName" placeholder="product name">
        <input type="number" id="pQty" placeholder="quantity">
        <input type="number" id="pPrice" placeholder="price(KES)">
        <button class="add-btn" onclick="saveProduct()">Save Product</button>
    </div>

    <button class="print-btn" onclick="window.print()">🖨️ Print Inventory Report</button>

    <table id="inventory-table">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script>
       function saveProduct() {
    var name = document.getElementById("pName").value;
    var qty = document.getElementById("pQty").value;
    var price = document.getElementById("pPrice").value;

    if (name == "" || qty == "" || price == "") {
        alert("Please fill all boxes!");
        return;
    }

    var table = document.getElementById("inventory-table").getElementsByTagName('tbody')[0];
    var row = table.insertRow();
    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = qty;
    row.insertCell(2).innerHTML = price;
    row.insertCell(3).innerHTML = '<button class="delete-btn" onclick="removeRow(this)">Delete</button>';

    // Clear inputs
    document.getElementById("pName").value = "";
    document.getElementById("pQty").value = "";
    document.getElementById("pPrice").value = "";
    
    // UPDATE THE DASHBOARD CARDS
    updateDashboard();
    alert("Success: " + name + " added!");
}

// New function to handle deleting and updating counts
function removeRow(btn) {
    btn.parentElement.parentElement.remove();
    updateDashboard();
}

// The "Brain" that calculates your totals
function updateDashboard() {
    var table = document.getElementById("inventory-table");
    var tbody = table.getElementsByTagName('tbody')[0];
    var rows = tbody.getElementsByTagName('tr');
    
    var totalItems = rows.length;
    var totalValue = 0;

    for (var i = 0; i < rows.length; i++) {
        var q = parseFloat(rows[i].cells[1].innerText) || 0;
        var p = parseFloat(rows[i].cells[2].innerText) || 0;
        totalValue += (q * p);
    }

    // Push the numbers into your green and orange boxes
    document.getElementById("total-items-count").innerText = totalItems;
    document.getElementById("total-value-count").innerText = "KES " + totalValue.toLocaleString();
        } 
            
            
    </script>

</body>
</html>
