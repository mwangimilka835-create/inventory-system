<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Full Cloud Edition</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <script>
      // REPLACE THESE WITH YOUR PROJECT DETAILS FROM SUPABASE
      const SUPABASE_URL = 'https://your-project-id.supabase.co';
      const SUPABASE_KEY = 'your-anon-public-key';
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #333; --primary: #2ecc71; --accent: #3498db; --danger: #e74c3c; }
        body.dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #44444433; }
        input, select, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; }
        .btn-primary { background: var(--primary); color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-sec { background: var(--accent); color: white; border: none; cursor: pointer; padding: 10px 20px; margin-right: 5px; }
        .btn-danger { background: var(--danger); color: white; border: none; cursor: pointer; }
        .btn-theme { float: right; cursor: pointer; background: none; border: 1px solid var(--text); color: var(--text); }
        .low-stock { color: var(--danger); font-weight: bold; background: rgba(231, 76, 60, 0.1); }
        .action-btns { display: flex; gap: 5px; }
    </style>
</head>

<body class="light-mode" id="body-theme">
    <div class="container">
        <header>
            <button onclick="toggleTheme()" class="btn-theme" id="theme-btn">🌙 Dark Mode</button>
            <h1>StockPro Cloud</h1>
        </header>

        <div class="stats-grid">
            <div class="card"><h3>Total Items</h3><p id="total-items">0</p></div>
            <div class="card"><h3>Inventory Value</h3><p id="total-value">KES 0</p></div>
        </div>

        <div class="card">
            <h2>Add / Update Product</h2>
            <form id="inventoryForm">
                <input type="hidden" id="edit-id">
                <input type="text" id="itemName" placeholder="Product Name" required style="width:98%">
                <div style="display:flex; gap:10px;">
                    <select id="itemCategory" style="flex:1">
                        <option value="Electronics">Electronics</option>
                        <option value="Construction">Construction</option>
                        <option value="General">General Merchandise</option>
                    </select>
                    <input type="number" id="itemQuantity" placeholder="Qty" required style="flex:1">
                    <input type="number" id="itemPrice" placeholder="Price" required style="flex:1">
                </div>
                <button type="submit" id="submit-btn" class="btn-primary">Save to Cloud Database</button>
            </form>
        </div>

        <div class="card">
            <div class="action-btns">
                <button onclick="exportToCSV()" class="btn-sec">📥 Export CSV</button>
                <button onclick="generatePDF()" class="btn-sec" style="background:#8e44ad">🖨️ Print PDF Report</button>
            </div>
            <table id="stockTable">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let inventory = [];

        document.addEventListener('DOMContentLoaded', fetchInventory);

        async function fetchInventory() {
            const { data, error } = await supabase.from('inventory').select('*').order('created_at', { ascending: false });
            if (!error) { inventory = data || []; renderTable(); updateStats(); }
        }

        document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const item = {
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                quantity: parseInt(document.getElementById('itemQuantity').value),
                price: parseFloat(document.getElementById('itemPrice').value)
            };

            if (id) {
                await supabase.from('inventory').update(item).eq('id', id);
                document.getElementById('edit-id').value = '';
                document.getElementById('submit-btn').innerText = 'Save to Cloud Database';
            } else {
                await supabase.from('inventory').insert([item]);
            }
            document.getElementById('inventoryForm').reset();
            fetchInventory();
        });

        function editItem(id) {
            const item = inventory.find(i => i.id === id);
            document.getElementById('edit-id').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemCategory').value = item.category;
            document.getElementById('itemQuantity').value = item.quantity;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('submit-btn').innerText = 'Update Product Info';
            window.scrollTo(0,0);
        }

        async function deleteItem(id) {
            if (confirm("Delete this product permanently?")) {
                await supabase.from('inventory').delete().eq('id', id);
                fetchInventory();
            }
        }

        async function adjustStock(id, currentQty, change) {
            await supabase.from('inventory').update({ quantity: currentQty + change }).eq('id', id);
            fetchInventory();
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryBody');
            tbody.innerHTML = '';
            inventory.forEach(item => {
                const isLow = item.quantity <= 5;
                const row = `<tr class="${isLow ? 'low-stock' : ''}">
                    <td>${item.name} ${isLow ? '⚠️' : ''}</td>
                    <td>${item.category}</td>
                    <td>${item.quantity}</td>
                    <td>KES ${item.price.toLocaleString()}</td>
                    <td class="action-btns">
                        <button onclick="adjustStock('${item.id}', ${item.quantity}, 1)">+</button>
                        <button onclick="adjustStock('${item.id}', ${item.quantity}, -1)">-</button>
                        <button onclick="editItem('${item.id}')" style="background:#f39c12; color:white; border:none; border-radius:5px;">Edit</button>
                        <button onclick="deleteItem('${item.id}')" class="btn-danger">Del</button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function updateStats() {
            const totalItems = inventory.reduce((sum, i) => sum + i.quantity, 0);
            const totalValue = inventory.reduce((sum, i) => sum + (i.quantity * i.price), 0);
            document.getElementById('total-items').innerText = totalItems;
            document.getElementById('total-value').innerText = `KES ${totalValue.toLocaleString()}`;
        }

        function exportToCSV() {
            let csv = "Product Name,Category,Quantity,Price (KES)\n";
            inventory.forEach(i => csv += `${i.name},${i.category},${i.quantity},${i.price}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'StockPro_Cloud_Report.csv'; a.click();
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("StockPro Inventory Report", 14, 15);
            const rows = inventory.map(i => [i.name, i.category, i.quantity, `KES ${i.price}`]);
            doc.autoTable({ head: [['Product', 'Category', 'Qty', 'Price']], body: rows, startY: 20 });
            doc.save("Inventory_Report.pdf");
        }

        function toggleTheme() {
            const body = document.getElementById('body-theme');
            body.classList.toggle('dark-mode');
            document.getElementById('theme-btn').innerText = body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
        }
    </script>
</body>
                    </html>
