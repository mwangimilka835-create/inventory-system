<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockPro | Ultimate 2026</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { 
            --bg: #0f0c15; --card: #1a1625; --text: #f0ebff; 
            --primary: #d4af37; --secondary: #38bdf8; --tertiary: #9d81ff; --danger: #ff4d4d; --accent: #2d2640;
        }
        body.light-mode { 
            --bg: #fdfdfd; --card: #ffffff; --text: #1a1a1a; --accent: #f0f0f0;
        }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; overflow-x: hidden; }
        
        /* Navigation */
        nav { background: var(--card); padding: 15px 20px; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent); }
        .tab-box { display: flex; gap: 15px; align-items: center; }
        .tab { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; opacity: 0.5; cursor: pointer; padding: 5px 0; }
        .tab.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }

        .container { max-width: 500px; margin: 15px auto; padding: 0 15px; display: none; }
        .page { display: none; animation: fadeIn 0.4s ease; } 
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Cards */
        .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        
        .btn { padding: 16px; border: none; cursor: pointer; border-radius: 10px; font-weight: 800; width: 100%; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-main { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: white; border-radius: 8px; width: 42px; height: 42px; border: none; }

        /* Scanner */
        #qr-view { width: 100%; min-height: 280px; display: none; border-radius: 12px; margin-bottom: 15px; border: 3px solid var(--primary); background: #000; overflow: hidden; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px 10px; color: var(--primary); border-bottom: 2px solid var(--accent); font-size: 0.75rem; }
        td { padding: 15px 10px; border-bottom: 1px solid var(--accent); font-size: 0.95rem; }
        
        /* POP-UP TOAST */
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; padding: 14px 28px; border-radius: 50px; display: none; font-weight: 900; z-index: 10001; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.9rem; }
/* M-PESA Modal Styles */
#pay-modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 10000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
}
.pay-card {
    background: #1a1a1a; width: 100%; max-width: 350px;
    border-radius: 24px; padding: 30px; text-align: center;
    border: 1px solid #333; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}
.mpesa-logo { width: 120px; margin-bottom: 20px; }
.pay-amount { color: #25D366; font-size: 32px; margin: 10px 0; font-weight: 800; }
.till-box {
    background: #252525; padding: 15px; border-radius: 12px;
    margin: 20px 0; border: 1px dashed #444;
}
.btn-confirm {
    width: 100%; padding: 16px; background: #25D366; color: white;
    border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
                       }
    </style>
</head>
<body class="dark-mode">

    <div id="auth-overlay" style="position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:var(--card); padding:30px; border-radius:20px; width:85%; max-width:340px; text-align:center; border:1px solid var(--primary);">
            <h2 style="color:var(--primary); margin:0;">STOCKPRO</h2>
            <p style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 20px;">Secure Inventory Management</p>
          <input type="text" id="u" placeholder="Enter Your Name">
<input type="password" id="p" placeholder="Set Password">
<select id="r_select" style="margin-bottom: 15px;">
    <option value="" disabled selected>Select Role</option>
    <option value="Admin">Admin</option>
    <option value="Staff">Staff</option>
</select>
<button class="btn btn-main" onclick="doLogin()">Unlock System</button>
            
        </div>
    </div>

    <nav id="navbar">
        <div style="font-weight:900; color:var(--primary)">STOCKPRO</div>
        <div class="tab-box">
            <div class="tab active" onclick="tab('dash', event)">Home</div>
            <div class="tab" onclick="tab('inv', event)">Ledger</div>
            <div class="tab" onclick="tab('rep', event)">Docs</div>
            <i class="fas fa-moon" id="mode-icon" onclick="toggleMode()" style="cursor:pointer; color:var(--primary); font-size: 1.3rem;"></i>
        </div>
    </nav>

    <div class="container" id="app">
        <section id="p-dash" class="page active">
            <div id="chart-card" class="card" style="display:none; height: 260px; text-align:center;">
                <canvas id="stockPie"></canvas>
            </div>
            <div class="card">
                <div id="qr-view"></div>
                <button id="scan-btn" class="btn" style="background:var(--accent); color:var(--text); margin-bottom:12px;" onclick="toggleScanner()">
                    <i class="fas fa-camera"></i> <span id="scan-text">Start Scanner</span>
                </button>
                <input id="n" placeholder="Item Name">
                <input id="q" type="number" placeholder="Quantity">
                <div id="adm-pr" style="display:none;"><input id="pr" type="number" placeholder="Price (KES)"></div>
                <select id="cat">
                    <option>Hardware</option>
                    <option>Software</option>
                    <option>Materials</option>
                </select>
                <button class="btn btn-main" onclick="add()">Commit Asset</button>
            </div>
        </section>

        <section id="p-inv" class="page">
            <div class="card">
                <input placeholder="Search assets..." onkeyup="draw()" id="find">
                <table>
                    <thead><tr><th>Asset</th><th>Qty</th><th>Action</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>

        <section id="p-rep" class="page">
            <div class="card" onclick="pdf()" style="cursor:pointer; display:flex; justify-content:space-between;">
                <span>Audit (PDF)</span> <i class="fas fa-file-pdf" style="color:var(--danger)"></i>
            </div>
            <div id="adm-csv" class="card" onclick="csv()" style="display:none; cursor:pointer; justify-content:space-between;">
                <span>Full Ledger (CSV)</span> <i class="fas fa-file-csv" style="color:var(--secondary)"></i>
            </div>
            <button class="btn" style="background:#25D366; color:white; margin-top:10px;" onclick="wa()">
                <i class="fab fa-whatsapp"></i> Sync to +254112873218
            </button>
        </section>
    </div>

    <div id="toast"></div>

<script type="module">
    // 1. FIREBASE CORE (Cloud Engine)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBAVRljN13EB1J8w4jJ3Qjk8iqjgxSqfAI",
        authDomain: "stockpro-9be18.firebaseapp.com",
        projectId: "stockpro-9be18",
        storageBucket: "stockpro-9be18.firebasestorage.app",
        messagingSenderId: "1025574986774",
        appId: "1:1025574986774:web:78fb24039432c921b84137",
        measurementId: "G-PWNYV0Y8G7"
    };

    const app = initializeApp(firebaseConfig);
    const fdb = getDatabase(app);
    const inventoryRef = ref(fdb, 'stock_final_v10');

    // --- GLOBAL VARIABLES ---
    window.db = []; 
    window.role = ''; 
    window.userName = ''; 
    window.chart = null; 
    window.html5QrCode = null;

    const itemDatabase = {
        "6161106610044": "Hardware Item A",
        "1234567890123": "Sample Tool"
    };

    // --- AUTH & NAVIGATION ---
    window.doLogin = function() {
        let nameInput = document.getElementById('u').value.trim();
        let passInput = document.getElementById('p').value.trim();
        let roleSelect = document.getElementById('r_select').value;
        if (!nameInput || !passInput || !roleSelect) {
            alert("Please fill all fields!"); return;
        }
        window.userName = nameInput;
        launch(roleSelect);
    };

    function launch(r) {
        window.role = r;
        document.getElementById('auth-overlay').style.display='none';
        document.getElementById('navbar').style.display='flex';
        document.getElementById('app').style.display='block';
        if(r === 'Admin') {
            document.getElementById('adm-pr').style.display = 'block';
            document.getElementById('adm-csv').style.display = 'flex';
            document.getElementById('chart-card').style.display = 'block';
            setTimeout(initChart, 500);
        }
        draw(); 
        window.toast(`✅ Access Granted: ${window.userName.toUpperCase()}`);
    }

    window.tab = function(p, e) {
        document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        e.currentTarget.classList.add('active');
    };

    // --- THEME ---
    window.toggleMode = function() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        document.getElementById('mode-icon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        if(window.chart) {
            window.chart.options.plugins.legend.labels.color = isLight ? '#1a1a1a' : '#f0ebff';
            window.chart.update();
        }
        window.toast(isLight ? "☀️ Light Mode" : "🌙 Dark Mode");
    };

    // --- CHART LOGIC ---
    function initChart() {
        const ctx = document.getElementById('stockPie').getContext('2d');
        window.chart = new Chart(ctx, {
            type: 'pie',
            data: { 
                labels: ['H/W', 'S/W', 'MAT'], 
                datasets: [{ data: [0,0,0], backgroundColor: ['#d4af37', '#38bdf8', '#9d81ff'], borderWidth: 0 }] 
            },
            options: { responsive: true, maintainAspectRatio: false, 
                plugins: { legend: { position: 'bottom', labels: { color: '#f0ebff', font: { weight: 'bold' } } } } 
            }
        });
        updateChart();
    }

    function updateChart() { 
        if(window.chart && window.db.length > 0) { 
            window.chart.data.datasets[0].data = ['Hardware','Software','Materials'].map(c => window.db.filter(i=>i.cat===c).length); 
            window.chart.update(); 
        } 
    }

    // --- CLOUD OPERATIONS ---
    onValue(inventoryRef, (snapshot) => {
        const data = snapshot.val();
        window.db = [];
        if (data) {
            Object.keys(data).forEach(id => {
                window.db.push({ ...data[id], firebaseId: id });
            });
        }
        draw();
        updateChart();
    });

    window.add = async function() {
        let n = document.getElementById('n').value.trim();
        let q = parseInt(document.getElementById('q').value);
        if(!n || isNaN(q)) return alert("Check inputs!");
        
        if(confirm(`Commit ${n} to stock?`)) {
            try {
                await push(inventoryRef, {
                    name: n, 
                    qty: q,
                    price: document.getElementById('pr').value || 0,
                    cat: document.getElementById('cat').value,
                    status: "pending", 
                    addedBy: window.userName,
                    timestamp: new Date().toISOString()
                });
                window.toast("📦 Asset Synced to Cloud");
                document.getElementById('n').value = ''; 
                document.getElementById('q').value = '';
            } catch (err) { alert("Cloud Sync Failed!"); }
        }
    };
    

    window.del = function(id) {
        if(window.role !== 'Admin') {
            return window.toast("❌ Access Denied: Only Admin can delete.");
        }
        if(confirm("Permanently delete from Cloud?")) {
            remove(ref(fdb, `stock_final_v10/${id}`))
            .then(() => { window.toast("🗑️ Entry Removed"); })
            .catch(() => { window.toast("🔒 Permission Denied by Cloud"); });
        }
    };
    window.draw = function() {
    let b = document.getElementById('table-body');
    let searchTerm = document.getElementById('find').value.toLowerCase();
    b.innerHTML = '';
    window.db.forEach(i => {
    // Inventory Status Badge
    const invBadge = i.status === "Verified" 
        ? '<span style="color: #4CAF50; font-size: 11px;">✅ Stock Verified</span>' 
        : '<span style="color: #ffa500; font-size: 11px;">⏳ Stock Pending</span>';

    // Payment Status Badge
    let payBadge = '';
    if (i.mpesaCode) {
        payBadge = `<br><span style="color: #38bdf8; font-size: 11px;">💳 Paid (Code: ${i.mpesaCode})</span>`;
    } else {
        payBadge = `<br><span style="color: #ff4d4d; font-size: 11px;">❌ Unpaid</span>`;
    }

    b.innerHTML += `
    <div class="card" style="margin-bottom: 10px; border-left: 5px solid ${i.status === 'Verified' ? '#4CAF50' : '#ffa500'}">
        <div style="display: flex; justify-content: space-between; align-items: start;">
            <div>
                <strong>${i.name}</strong> <small style="opacity:0.6">(${i.cat})</small><br>
                ${invBadge}
                ${payBadge}
            </div>
            <div style="text-align: right;">
                <span style="font-size: 1.2rem; font-weight: bold;">${i.qty}</span><br>
                <small>Items</small>
            </div>
        </div>
        
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button class="btn-main" style="flex: 1; background: #25D366;" onclick="window.initPay('${i.firebaseId}', '${i.price || 0}', '${i.name}')">
                <i class="fas fa-money-bill-wave"></i> Pay
            </button>
            
            <button class="btn-main" style="flex: 1; background: #38bdf8;" onclick="verifyStock('${i.firebaseId}')">
                <i class="fas fa-check-double"></i> Verify
            </button>

            <button class="btn-danger" style="width: 45px;" onclick="del('${i.firebaseId}')">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </div>`;
    }
});
    
    // --- SCANNER ---
    window.toggleScanner = async function() {
        const qrBox = document.getElementById('qr-view');
        const btnText = document.getElementById('scan-text');
        if (!window.html5QrCode) {
            qrBox.style.display = 'block';
            window.html5QrCode = new Html5Qrcode("qr-view");
            btnText.innerText = "Kill Scanner";
            window.toast("📷 Opening Camera...");
            try {
                await window.html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 240 }, (t) => { 
                    const foundName = itemDatabase[t] || t;
                    document.getElementById('n').value = foundName; 
                    document.getElementById('q').value = "1";
                    window.toast("🔍 Scanned: " + foundName); 
                    window.stopScanner(); 
                });
            } catch (err) { alert("Enable Camera Permissions!"); window.stopScanner(); }
        } else { window.stopScanner(); }
    };

    window.stopScanner = async function() {
        if (window.html5QrCode) {
            try { await window.html5QrCode.stop(); } catch (e) {}
            window.html5QrCode = null;
            document.getElementById('qr-view').style.display = 'none';
            document.getElementById('qr-view').innerHTML = ''; 
            document.getElementById('scan-text').innerText = "Start Scanner";
        }
    };

    // --- EXPORTS & WHATSAPP ---
    window.csv = function() {
        let c = "Item,Qty,Price,Category,User,Status\n";
        window.db.forEach(i => c += `"${i.name}",${i.qty},${i.price},"${i.cat}","${i.addedBy}","${i.status}"\n`);
        const blob = new Blob([c], { type: 'text/csv' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "Inventory.csv";
        link.click();
        window.toast("📄 CSV Downloaded");
    };

    window.pdf = function() {
        const { jsPDF } = window.jspdf; 
        const doc = new jsPDF();
        doc.text("StockPro Cloud Audit", 14, 15);
        doc.autoTable({ head: [['Item', 'Qty', 'Category', 'Status']], body: window.db.map(i => [i.name, i.qty, i.cat, i.status]) });
        doc.save('Audit.pdf');
        window.toast("📕 PDF Downloaded");
    };

    window.wa = function() {
        if (!window.db || window.db.length === 0) {
            window.toast("⚠️ Nothing to sync!");
            return;
        }
        let m = '*STOCKPRO CLOUD UPDATE*%0A';
        window.db.forEach(i => m += `• ${i.name}: ${i.qty} (${i.status})%0A`);
        window.open('https://wa.me/254112873218?text=' + m);
    };

    window.toast = function(m) { 
        let t=document.getElementById('toast'); 
        t.innerText=m; t.style.display='block'; 
        setTimeout(()=>t.style.display='none', 3000); 
    };
window.initPay = function(id, price, name) {
    const modal = document.createElement('div');
    modal.id = 'pay-modal-overlay';
    modal.innerHTML = `
        <div class="pay-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/M-PESA_LOGO-01.svg" class="mpesa-logo">
            <p style="color:#aaa; margin-bottom:5px;">Payment for ${name}</p>
            <div class="pay-amount">KES ${price}</div>
            
            <div class="till-box">
                <small style="color:#888; display:block;">LIPA NA M-PESA TILL</small>
                <strong style="color:#fff; font-size:26px; letter-spacing:1px;">5637180</strong>
            </div>

            <input type="text" id="mpesa-code" placeholder="Enter M-PESA Code (e.g. SDE45FG67)" 
                style="text-transform: uppercase; text-align: center; margin-bottom: 15px; border: 1px solid #25D366;">

            <button class="btn-confirm" onclick="window.confirmPaid('${id}', '${name}')">
                CONFIRM & VERIFY
            </button>
            
            <button onclick="document.getElementById('pay-modal-overlay').remove()" 
                style="width:100%; margin-top:15px; background:transparent; color:#666; border:none; cursor:pointer;">
                CANCEL
            </button>
        </div>`;
    document.body.appendChild(modal);
};
    window.confirmPaid = function(id, name) {
    // 1. Get the code from the input field inside the card
    const codeInput = document.getElementById('mpesa-code');
    const code = codeInput ? codeInput.value.trim() : "";

    if (!code || code.length < 5) {
        window.toast("❌ Please enter the M-PESA code in the box.");
        return;
    }

    window.toast("⌛ Syncing to StockPro Cloud...");

    // 2. Use the existing Firebase connection
    import("https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js").then((dbModule) => {
        const itemRef = dbModule.ref(window.fdb, 'stock_final_v10/' + id);

        // 3. Update the database WITHOUT changing the verification status
        dbModule.update(itemRef, {
            mpesaCode: code.toUpperCase(),
            paidAt: new Date().toISOString()
        }).then(() => {
            window.toast("✅ Payment details saved!");
            
            // 4. Close the modal
            const modal = document.getElementById('pay-modal-overlay');
            if (modal) modal.remove();
            
            // 5. Refresh the list so the blue code appears
            if(window.loadData) window.loadData(); 

        }).catch((e) => {
            console.error("Firebase Error:", e);
            alert("System Error: " + e.message);
        });
    });
};
    
    
</script>
