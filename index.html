<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Purple Elite</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* COLOR VARIABLES */
        :root { 
            --bg: #120e1a; --card: #1e1a2b; --text: #f0ebff; 
            --primary: #d4af37; --secondary: #9d81ff; --danger: #ff4d4d; --accent: #2d2640;
        }
        /* LIGHT MODE OVERRIDE */
        [data-theme="light"] { 
            --bg: #f4f2f9; --card: #ffffff; --text: #1a1625; 
            --accent: #e5e0f2;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: background 0.3s; }
        
        /* AUTH OVERLAY */
        #auth-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 15px; width: 85%; max-width: 340px; text-align: center; border: 1px solid var(--primary); }

        /* NAV */
        nav { background: var(--card); padding: 15px 20px; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent); }
        .nav-brand { font-weight: 900; color: var(--primary); }
        .tab-box { display: flex; gap: 15px; align-items: center; }
        .tab { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; opacity: 0.5; cursor: pointer; }
        .tab.active { opacity: 1; color: var(--primary); }

        .container { max-width: 500px; margin: 15px auto; padding: 0 15px; display: none; }
        .page { display: none; } .page.active { display: block; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 8px; box-sizing: border-box; }
        
        .btn { padding: 14px; border: none; cursor: pointer; border-radius: 8px; font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.2s; }
        .btn-main { background: var(--primary); color: #120e1a; }
        .btn-alt { background: var(--accent); color: var(--text); border: 1px solid var(--secondary); margin-bottom: 10px; }

        #qr-view { width: 100%; display: none; border-radius: 10px; overflow: hidden; margin-bottom: 10px; border: 2px solid var(--primary); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 10px; color: var(--primary); border-bottom: 1px solid var(--accent); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--accent); }
        
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; padding: 10px 20px; border-radius: 50px; display: none; font-weight: bold; z-index: 10001; }
    </style>
</head>
<body data-theme="dark">

    <div id="auth-overlay">
        <div class="auth-card">
            <h1 style="color:var(--primary); margin:0;">STOCKPRO</h1>
            <p style="font-size:0.8rem; opacity:0.5; margin-bottom:20px;">Inventory Management</p>
            <input type="text" id="u" placeholder="Username (admin/staff)">
            <input type="password" id="p" placeholder="Password (1234)">
            <button class="btn btn-main" onclick="doLogin()">Login</button>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-brand">STOCKPRO</div>
        <div class="tab-box">
            <div class="tab active" onclick="tab('dash', event)">Home</div>
            <div class="tab" onclick="tab('inv', event)">Ledger</div>
            <div class="tab" onclick="tab('rep', event)">Docs</div>
            <div onclick="toggleMode()" style="cursor:pointer; color:var(--primary); margin-left:10px;"><i class="fas fa-moon" id="mode-icon"></i></div>
        </div>
    </nav>

    <div class="container" id="app">
        <section id="p-dash" class="page active">
            <div id="adm-row" style="display:none; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                <div class="card" style="text-align:center;"><small>VALUATION</small><div id="stat-v" style="color:var(--primary); font-weight:bold;">0</div></div>
                <div class="card" style="text-align:center;"><small>TOTAL ITEMS</small><div id="stat-i" style="font-weight:bold;">0</div></div>
            </div>

            <div id="chart-card" class="card" style="display:none; height: 200px;"><canvas id="stockChart"></canvas></div>

            <div class="card">
                <div id="qr-view"></div>
                <button class="btn btn-alt" onclick="scan()"><i class="fas fa-qrcode"></i> Scan Asset</button>
                <input id="n" placeholder="Item Name">
                <input id="q" type="number" placeholder="Quantity">
                <div id="adm-pr" style="display:none;"><input id="pr" type="number" placeholder="Unit Price (KES)"></div>
                <select id="cat"><option>Hardware</option><option>Software</option><option>Materials</option></select>
                <button class="btn btn-main" onclick="add()">Commit Asset</button>
            </div>
        </section>

        <section id="p-inv" class="page">
            <div class="card">
                <input placeholder="Search ledger..." onkeyup="draw()" id="find">
                <table>
                    <thead><tr><th>Asset</th><th>Qty</th><th class="adm-only" style="display:none">Price</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>

        <section id="p-rep" class="page">
            <div class="card" onclick="pdf()" style="cursor:pointer">
                Audit Report (PDF) <i class="fas fa-file-pdf" style="float:right; color:var(--danger)"></i>
            </div>
            <div id="adm-csv" class="card" onclick="csv()" style="display:none; cursor:pointer">
                Ledger Export (CSV) <i class="fas fa-file-csv" style="float:right; color:var(--secondary)"></i>
            </div>
            <button class="btn" style="background:#25D366; color:white; margin-top:10px;" onclick="wa()"><i class="fab fa-whatsapp"></i> WhatsApp Update</button>
        </section>
    </div>

    <div id="toast"></div>

    <script>
        let db = JSON.parse(localStorage.getItem('final_stock_db')) || [];
        let role = 'Guest'; let chart = null; let scanner = null;

        function doLogin() {
            let user = document.getElementById('u').value.trim().toLowerCase();
            let pass = document.getElementById('p').value.trim();
            if (user === 'admin' && pass === '1234') launch('Admin');
            else if (user === 'staff' && pass === 'staff') launch('Staff');
            else alert("Error: Use admin / 1234");
        }

        function launch(r) {
            role = r;
            document.getElementById('auth-overlay').style.display='none';
            document.getElementById('navbar').style.display='flex';
            document.getElementById('app').style.display='block';
            if(r === 'Admin') {
                document.getElementById('adm-row').style.display = 'grid';
                document.getElementById('adm-pr').style.display = 'block';
                document.getElementById('adm-csv').style.display = 'block';
                document.getElementById('chart-card').style.display = 'block';
                initChart();
            }
            draw();
        }

        function toggleMode() {
            let body = document.body;
            let icon = document.getElementById('mode-icon');
            if(body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-sun';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fas fa-moon';
            }
        }

        function add() {
            let name = document.getElementById('n').value, qty = parseInt(document.getElementById('q').value);
            if(!name || isNaN(qty)) return toast("Fill Name/Qty");
            db.push({ id:Date.now(), name, qty, price:document.getElementById('pr').value||0, cat:document.getElementById('cat').value, time:new Date().toLocaleTimeString() });
            localStorage.setItem('final_stock_db', JSON.stringify(db));
            draw(); toast("Asset Added");
            document.getElementById('n').value=''; document.getElementById('q').value='';
        }

        function draw() {
            let body = document.getElementById('table-body'), s = document.getElementById('find').value.toLowerCase();
            body.innerHTML = '';
            db.filter(i => i.name.toLowerCase().includes(s)).forEach(i => {
                body.innerHTML += `<tr>
                    <td>${i.name}<br><small style="opacity:0.4">${i.time}</small></td>
                    <td style="color:${i.qty < 5 ? 'var(--danger)' : 'inherit'}">${i.qty}</td>
                    <td class="adm-only" style="display:${role==='Admin'?'table-cell':'none'}">${i.price}</td>
                </tr>`;
            });
            let val = db.reduce((s,i)=>s+(i.qty*i.price),0);
            document.getElementById('stat-v').innerText = 'KES ' + val.toLocaleString();
            document.getElementById('stat-i').innerText = db.length;
            if(chart) {
                chart.data.datasets[0].data = ['Hardware','Software','Materials'].map(c => db.filter(i=>i.cat===c).length);
                chart.update();
            }
        }

        function initChart() {
            const ctx = document.getElementById('stockChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: ['H/W', 'S/W', 'MAT'], datasets: [{ data: [0,0,0], backgroundColor: ['#d4af37', '#38bdf8', '#9d81ff'] }] },
                options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{color:'gray'}},x:{ticks:{color:'gray'}}} }
            });
        }

        function scan() {
            const v = document.getElementById('qr-view');
            if(!scanner) {
                v.style.display='block'; scanner = new Html5Qrcode("qr-view");
                scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t) => { document.getElementById('n').value=t; scan(); });
            } else {
                scanner.stop().then(() => { scanner=null; v.style.display='none'; });
            }
        }

        function pdf() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.text("Stock Audit", 14, 15);
            doc.autoTable({ head: [['Item', 'Qty', 'Price']], body: db.map(i => [i.name, i.qty, i.price]) });
            doc.save('Audit.pdf');
        }

        function csv() {
            let c = "Item,Qty,Price\n"; db.forEach(i=>c+=`${i.name},${i.qty},${i.price}\n`);
            let b = new Blob([c],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='Ledger.csv'; a.click();
        }

        function tab(p, e) {
            document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
            document.getElementById('p-'+p).classList.add('active');
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            e.currentTarget.classList.add('active');
        }

        function toast(m) { let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
        function wa() { let m = 'Inventory Update:%0A'; db.forEach(i=>m+=`${i.name}: ${i.qty}%0A`); window.open('https://wa.me/254700000000?text='+m); }
    </script>
</body>
                                        </html>
