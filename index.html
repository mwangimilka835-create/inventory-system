<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Executive Analytics</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #1e272e; --secondary: #d4af37; --bg: #f4f7f6;
            --card: #ffffff; --text: #2c3e50; --accent: #dcdde1; --danger: #c23616;
        }
        [data-theme="dark"] {
            --bg: #13171a; --card: #1e272e; --text: #f5f6fa; --accent: #353b48;
        }

        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.5s; }

        nav { background: var(--primary); padding: 20px 5%; display: none; flex-direction: column; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-size: 2rem; font-weight: 800; color: var(--secondary); letter-spacing: 2px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-item { cursor: pointer; color: #fff; opacity: 0.6; padding: 10px; font-size: 0.8rem; }
        .nav-item.active { opacity: 1; border-bottom: 2px solid var(--secondary); color: var(--secondary); }

        #auth-overlay { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 4px; width: 85%; max-width: 350px; text-align: center; border-top: 5px solid var(--secondary); }

        .container { max-width: 950px; margin: 2rem auto; padding: 0 20px; display: none; }
        .page { display: none; animation: fadeIn 0.6s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); padding: 25px; border-radius: 4px; border-left: 4px solid var(--secondary); margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { padding: 20px; background: var(--primary); color: var(--secondary); text-align: center; border-radius: 4px; }
        .stat-box h2 { font-size: 1.5rem; margin: 5px 0; color: #fff; }

        /* Chart Canvas Size */
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }

        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); }
        .btn { padding: 15px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 700; width: 100%; transition: 0.3s; }
        .btn-main { background: var(--secondary); color: var(--primary); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--secondary); border-bottom: 2px solid var(--secondary); font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid var(--accent); font-size: 0.9rem; }
        
        .badge { padding: 4px 8px; font-size: 0.7rem; font-weight: 800; border: 1px solid; }
        .badge-low { border-color: var(--danger); color: var(--danger); }
        .badge-ok { border-color: var(--secondary); color: var(--secondary); }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--secondary); padding: 12px 30px; display: none; border: 1px solid var(--secondary); z-index: 10001; }
    </style>
</head>
<body data-theme="light">

    <div id="auth-overlay">
        <div class="auth-card" id="setup-box">
            <h1 style="color:var(--primary); margin:0;">STOCKPRO</h1>
            <p style="font-size:0.7rem; letter-spacing:1px; margin-bottom:20px;">ANALYTICS SUITE</p>
            <input type="text" id="reg-fname" placeholder="Admin Name">
            <input type="password" id="reg-pass" placeholder="Master Key">
            <button class="btn btn-main" onclick="register()">Initialize</button>
        </div>
        <div class="auth-card" id="login-box" style="display: none;">
            <h2 id="greet-user">Security Check</h2>
            <input type="password" id="login-pass" placeholder="Enter Key">
            <button class="btn btn-main" onclick="login()">Unlock</button>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-brand">STOCKPRO</div>
        <div class="nav-links">
            <div class="nav-item active" onclick="nav('dashboard', event)">Overview</div>
            <div class="nav-item" onclick="nav('inventory', event)">Ledger</div>
            <div class="nav-item" onclick="nav('reports', event)">Reports</div>
            <div class="nav-item" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></div>
        </div>
    </nav>

    <div class="container" id="app-body">
        
        <section id="page-dashboard" class="page active">
            <div class="stats-grid">
                <div class="stat-box">
                    <small>TOTAL VALUE</small>
                    <h2 id="stat-val">KES 0</h2>
                </div>
                <div class="stat-box">
                    <small>ASSET COUNT</small>
                    <h2 id="stat-items">0</h2>
                </div>
            </div>

            <div class="card">
                <h3 style="margin:0 0 15px 0; font-size:1rem;">Asset Allocation</h3>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top:0">Quick Entry</h3>
                <input type="text" id="p-name" placeholder="Asset Name">
                <select id="p-cat">
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Materials">Materials</option>
                    <option value="Services">Services</option>
                </select>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="p-qty" placeholder="Qty">
                    <input type="number" id="p-price" placeholder="Price">
                </div>
                <button class="btn btn-main" onclick="addItem()">Commit Data</button>
            </div>
        </section>

        <section id="page-inventory" class="page">
            <div class="card">
                <input type="text" id="search" placeholder="Filter Ledger..." onkeyup="renderTable()">
                <table>
                    <thead><tr><th>Asset</th><th>Status</th><th>Value</th><th></th></tr></thead>
                    <tbody id="stock-table"></tbody>
                </table>
            </div>
        </section>

        <section id="page-reports" class="page">
            <div class="card" onclick="exportPDF()" style="cursor:pointer"><h4><i class="fas fa-file-pdf"></i> Generate PDF</h4></div>
            <div class="card" onclick="exportCSV()" style="cursor:pointer"><h4><i class="fas fa-file-csv"></i> Sync CSV</h4></div>
        </section>
    </div>

    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        let inventory = JSON.parse(localStorage.getItem('sp_v4_data')) || [];
        let account = JSON.parse(localStorage.getItem('sp_v4_acc'));
        let myChart = null; // Global chart variable

        window.onload = () => {
            if(account) {
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('login-box').style.display = 'block';
                document.getElementById('greet-user').innerText = account.fname;
            }
        };

        function register() {
            const f = document.getElementById('reg-fname').value;
            const p = document.getElementById('reg-pass').value;
            if(!f || !p) return;
            account = { fname: f, pass: p };
            localStorage.setItem('sp_v4_acc', JSON.stringify(account));
            start();
        }

        function login() {
            if(document.getElementById('login-pass').value === account.pass) start();
            else alert("Denied");
        }

        function start() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('app-body').style.display = 'block';
            initChart(); // Start chart on launch
            refresh();
        }

        function nav(p, e) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(e) e.target.classList.add('active');
        }

        function addItem() {
            const n = document.getElementById('p-name').value;
            const q = parseInt(document.getElementById('p-qty').value);
            const p = parseFloat(document.getElementById('p-price').value);
            const c = document.getElementById('p-cat').value;
            if(!n || isNaN(q)) return;

            inventory.push({ id: Date.now(), name: n, cat: c, qty: q, price: p });
            save(); toast("Data Synced");
            ['p-name','p-qty','p-price'].forEach(id => document.getElementById(id).value = '');
        }

        function save() {
            localStorage.setItem('sp_v4_data', JSON.stringify(inventory));
            refresh();
            updateChart(); // Push new data to chart
        }

        function refresh() {
            renderTable();
            const val = inventory.reduce((s, i) => s + (i.qty * i.price), 0);
            document.getElementById('stat-val').innerText = `KES ${val.toLocaleString()}`;
            document.getElementById('stat-items').innerText = inventory.length;
        }

        function renderTable() {
            const body = document.getElementById('stock-table');
            const search = document.getElementById('search').value.toLowerCase();
            body.innerHTML = '';
            inventory.filter(i => i.name.toLowerCase().includes(search)).forEach(i => {
                const bClass = i.qty < 5 ? 'badge-low' : 'badge-ok';
                body.innerHTML += `<tr><td><strong>${i.name.toUpperCase()}</strong></td><td><span class="badge ${bClass}">${i.qty}</span></td><td>${i.price.toLocaleString()}</td><td onclick="deleteItem(${i.id})"><i class="fas fa-trash"></i></td></tr>`;
            });
        }

        function deleteItem(id) {
            inventory = inventory.filter(i => i.id !== id);
            save();
        }

        /* --- CHART LOGIC --- */
        function initChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'bar', // Professional bar chart
                data: {
                    labels: ['Hardware', 'Software', 'Materials', 'Services'],
                    datasets: [{
                        label: 'Stock Value (KES)',
                        data: [0, 0, 0, 0],
                        backgroundColor: '#d4af37', // Gold bars
                        borderColor: '#1e272e',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } } }
                }
            });
            updateChart();
        }

        function updateChart() {
            if(!myChart) return;
            const cats = ['Hardware', 'Software', 'Materials', 'Services'];
            const values = cats.map(c => {
                return inventory.filter(i => i.cat === c).reduce((sum, item) => sum + (item.qty * item.price), 0);
            });
            myChart.data.datasets[0].data = values;
            myChart.update();
        }

        function toast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function toggleDarkMode() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            if(myChart) {
                myChart.options.scales.y.grid.color = isDark ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.1)';
                myChart.update();
            }
        }
        
        // Export logic kept simple for brevity
        function exportPDF() { 
            const { jsPDF } = window.jspdf; const doc = new jsPDF(); 
            doc.text("Executive Audit", 10, 10);
            doc.autoTable({ head:[['Asset','Qty','Price']], body: inventory.map(i=>[i.name, i.qty, i.price]) });
            doc.save('Audit.pdf');
        }
        function exportCSV() { 
            let c="Asset,Qty,Price\n"; inventory.forEach(i=>c+=`${i.name},${i.qty},${i.price}\n`);
            const b=new Blob([c],{type:'text/csv'}); const a=document.createElement('a');
            a.href=URL.createObjectURL(b); a.download='Ledger.csv'; a.click();
        }
    </script>
</body>
                </html>
