<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Master Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --primary: #1e272e; --secondary: #d4af37; --bg: #f4f7f6; --card: #ffffff; --text: #2c3e50; --accent: #dcdde1; --danger: #c23616; }
        [data-theme="dark"] { --bg: #13171a; --card: #1e272e; --text: #f5f6fa; --accent: #353b48; }
        
        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        nav { background: var(--primary); padding: 15px 5%; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--secondary); }
        .nav-brand { font-size: 1.5rem; font-weight: 800; color: var(--secondary); letter-spacing: 2px; }
        .nav-item { cursor: pointer; color: #fff; opacity: 0.7; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }
        .nav-item.active { opacity: 1; color: var(--secondary); border-bottom: 2px solid var(--secondary); }
        
        #auth-overlay { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { background: var(--card); padding: 35px; border-radius: 4px; width: 90%; max-width: 380px; text-align: center; border-top: 5px solid var(--secondary); }
        
        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 15px; display: none; }
        .page { display: none; } .page.active { display: block; }
        .card { background: var(--card); padding: 20px; border-radius: 4px; border-left: 4px solid var(--secondary); margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .admin-only, .staff-only { display: none; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 15px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 800; width: 100%; margin-top: 10px; }
        .btn-main { background: var(--secondary); color: var(--primary); }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; color: var(--secondary); border-bottom: 2px solid var(--secondary); font-size: 0.7rem; }
        td { padding: 10px; border-bottom: 1px solid var(--accent); font-size: 0.8rem; }
        
        .badge-low { color: var(--danger); font-weight: bold; border: 1px solid var(--danger); padding: 2px 5px; border-radius: 3px; font-size: 0.65rem; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--secondary); padding: 12px 25px; display: none; z-index: 10001; }
        #alert-box { background: rgba(194, 54, 22, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body data-theme="light">
    <div id="auth-overlay">
        <div class="auth-card">
            <h1>STOCKPRO</h1>
            <input type="text" id="login-user" placeholder="Username (Admin/Staff)">
            <input type="password" id="login-pass" placeholder="Access Key">
            <button class="btn btn-main" onclick="handleAuth()">Login</button>
            <button class="btn" style="background:var(--accent);" onclick="enterAs('Guest')">Guest View</button>
            <p style="font-size:0.6rem; opacity:0.5; margin-top:15px;">Admin: admin/1234 | Staff: staff/staff</p>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-brand">STOCKPRO</div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div class="nav-item active" onclick="nav('dashboard', event)">Home</div>
            <div class="nav-item" onclick="nav('inventory', event)">Ledger</div>
            <div class="nav-item" onclick="nav('reports', event)">Reports</div>
            <div class="nav-item" onclick="toggleDarkMode()"><i class="fas fa-moon" id="t-icon"></i></div>
        </div>
    </nav>

    <div class="container" id="app-body">
        <div id="alert-box"><i class="fas fa-exclamation-triangle"></i> <strong>Critical Attention:</strong> <span id="low-stock-list"></span></div>

        <section id="page-dashboard" class="page active">
            <div class="admin-only" style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px;">
                <div class="card" style="text-align:center;"><small>CAPITAL</small><h2 id="stat-val">KES 0</h2></div>
                <div class="card" style="text-align:center;"><small>ITEMS</small><h2 id="stat-items">0</h2></div>
            </div>
            <div class="admin-only card"><canvas id="categoryChart" style="max-height:200px;"></canvas></div>
            <div class="staff-only card">
                <h3>Asset Intake</h3>
                <div id="reader" style="display:none; margin-bottom:10px;"></div>
                <button class="btn" style="background:var(--primary); color:var(--secondary);" onclick="toggleScanner()">Scan Barcode</button>
                <input type="text" id="p-name" placeholder="Item Name">
                <input type="number" id="p-qty" placeholder="Quantity">
                <input type="number" id="p-price" placeholder="Price" class="admin-only">
                <select id="p-cat"><option>Hardware</option><option>Software</option><option>Materials</option></select>
                <button class="btn btn-main" onclick="addItem()">Commit to Database</button>
            </div>
        </section>

        <section id="page-inventory" class="page">
            <div class="card">
                <input type="text" id="search" placeholder="Filter Assets..." onkeyup="renderTable()">
                <div style="overflow-x:auto;">
                    <table>
                        <thead><tr><th>Asset & Timestamp</th><th>Stock</th><th class="admin-only">Value</th><th>Action</th></tr></thead>
                        <tbody id="stock-table"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="page-reports" class="page">
            <div class="card" onclick="exportPDF()" style="cursor:pointer"><h4><i class="fas fa-file-pdf"></i> Download Audit PDF</h4></div>
            <div class="admin-only card" onclick="exportCSV()" style="cursor:pointer"><h4><i class="fas fa-file-csv"></i> Sync Spreadsheet Ledger</h4></div>
            <button class="btn btn-main" style="background:#25D366; color:white;" onclick="sendWA()">Broadcast Stock to Manager</button>
        </section>
    </div>
    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script>
        let inventory = JSON.parse(localStorage.getItem('stock_data')) || [];
        let currentUser = 'Guest';
        let myChart = null; let html5QrCode = null;

        function handleAuth() {
            const u = document.getElementById('login-user').value.toLowerCase();
            const p = document.getElementById('login-pass').value;
            if (u === 'admin' && p === '1234') enterAs('Admin');
            else if (u === 'staff' && p === 'staff') enterAs('Staff');
            else alert("Invalid Credentials");
        }

        function enterAs(role) {
            currentUser = role;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('app-body').style.display = 'block';
            if(role === 'Admin') { document.querySelectorAll('.admin-only, .staff-only').forEach(e => e.style.display = 'block'); initChart(); }
            else if(role === 'Staff') document.querySelectorAll('.staff-only').forEach(e => e.style.display = 'block');
            refresh();
        }

        function toggleDarkMode() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('t-icon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        function addItem() {
            const n = document.getElementById('p-name').value;
            const q = parseInt(document.getElementById('p-qty').value);
            if(!n || isNaN(q)) return toast("Fill required fields");
            
            const timestamp = new Date().toLocaleString(); // Added Timestamp
            inventory.push({ id:Date.now(), name:n, qty:q, price:document.getElementById('p-price').value||0, cat:document.getElementById('p-cat').value, time:timestamp });
            localStorage.setItem('stock_data', JSON.stringify(inventory));
            refresh(); if(myChart) updateChart();
            toast("Asset Committed Successfully");
        }

        function renderTable() {
            const body = document.getElementById('stock-table');
            const alertBox = document.getElementById('alert-box');
            const lowStockNames = [];
            body.innerHTML = '';
            
            inventory.forEach(i => {
                if(i.qty < 5) lowStockNames.push(i.name); // Check for low stock
                body.innerHTML += `<tr>
                    <td><strong>${i.name}</strong><br><small style="opacity:0.6">${i.time}</small></td>
                    <td><span class="${i.qty < 5 ? 'badge-low' : ''}">${i.qty} UNITS</span></td>
                    <td class="admin-only">KES ${i.price}</td>
                    <td>${currentUser==='Admin' ? `<i class='fas fa-trash' onclick='del(${i.id})'></i>` : ''}</td>
                </tr>`;
            });

            // Update Alert Box
            if(lowStockNames.length > 0) {
                alertBox.style.display = 'block';
                document.getElementById('low-stock-list').innerText = lowStockNames.join(', ') + " running low.";
            } else { alertBox.style.display = 'none'; }

            if(currentUser==='Admin') document.querySelectorAll('.admin-only').forEach(e=>e.style.display='table-cell');
        }

        function exportCSV() {
            let csv = "Item,Qty,Price,Timestamp\n"; 
            inventory.forEach(i => csv += `${i.name},${i.qty},${i.price},${i.time}\n`);
            const blob = new Blob([csv], {type:'text/csv'}); 
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'StockPro_Ledger.csv'; a.click();
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.text("Official Audit Ledger: Milka", 14, 15);
            doc.autoTable({ head:[['Asset','Qty','Unit Price','Recorded On']], body: inventory.map(i=>[i.name, i.qty, i.price, i.time]) });
            doc.save('StockPro_Audit.pdf');
        }

        function del(id) { if(confirm("Delete item?")) { inventory = inventory.filter(i=>i.id!==id); localStorage.setItem('stock_data', JSON.stringify(inventory)); refresh(); } }
        function refresh() { renderTable(); const v = inventory.reduce((s,i)=>s+(i.qty*i.price),0); document.getElementById('stat-val').innerText = 'KES '+v.toLocaleString(); document.getElementById('stat-items').innerText = inventory.length; }
        function initChart() { const ctx = document.getElementById('categoryChart').getContext('2d'); myChart = new Chart(ctx, { type:'doughnut', data:{ labels:['Hardware','Software','Materials'], datasets:[{data:[0,0,0], backgroundColor:['#d4af37','#1e272e','#353b48']}] } }); updateChart(); }
        function updateChart() { if(!myCh) return; const cats=['Hardware','Software','Materials']; myChart.data.datasets[0].data = cats.map(c=>inventory.filter(i=>i.cat===c).length); myChart.update(); }
        function nav(p, e) { document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active')); e.target.classList.add('active'); }
        function sendWA() { let msg = '*DRAFT: SYSTEM SYNC - MILKA* %0A'; inventory.forEach(i=>msg+=`⚠️ ${i.name}: ${i.qty}%0A`); window.open('https://wa.me/254700000000?text='+msg); }
        function toggleScanner() { const r = document.getElementById('reader'); if(!html5QrCode) { r.style.display='block'; html5QrCode = new Html5Qrcode("reader"); html5QrCode.start({facingMode:"environment"}, {fps:10, qrbox:250}, (t)=>{document.getElementById('p-name').value=t; toggleScanner();}); } else { html5QrCode.stop().then(()=>{html5QrCode=null; r.style.display='none';}); } }
        function toast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
    </script>
</body>
                                                                                                           </html>
