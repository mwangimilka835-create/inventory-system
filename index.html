<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory App</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --primary-color: #2c3e50;
            --accent-color: #f1c40f;
        }

        .dark-mode {
    --bg-color: #1a1a1a;
    --text-color: #f4f4f4;
    --card-bg: #2c2c2c;
    --primary-color: #34495e; /* This keeps the cards dark so text is readable */
    --accent-color: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        stat-card {
    background: #2c3e50; /* Dark blue background */
    color: #ffffff;      /* White text for "Total Items" */
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }

        /* This makes the numbers (the gold part) pop */
.stat-card span {
    display: block;
    font-size: 22px;
    font-weight: bold;
    color: #f1c40f; /* Signature gold */
    margin-top: 5px;
}

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: 0.2s;
        }

        .btn-save { background-color: #27ae60; color: white; }
        .btn-export { background-color: #3498db; color: white; }
        .btn-dark { background-color: #8e44ad; color: white; width: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #2c3e50;
            color: #f1c40f;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .delete-btn { background: #e74c3c; color: white; padding: 5px; width: auto; }
        .order-btn { background: #25D366; color: white; padding: 5px; width: auto; text-decoration: none; border-radius: 4px; display: inline-block; }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 16px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>📦 Smart Inventory</h2>
        <div>
            <span id="user-name-display" style="font-weight:bold; margin-right:10px;"></span>
            <button class="btn-dark no-print" onclick="toggleDarkMode()" id="darkModeToggle">🌙</button>
        </div>
    </header>

    <div class="stats-grid no-print">
        <div class="stat-card">Total Items <span id="total-items-count">0</span></div>
        <div class="stat-card">Stock Value <span id="total-value-count">KES 0</span></div>
    </div>

    <div class="no-print" style="background: var(--bg-color); padding: 15px; border-radius: 8px;">
        <h3>Add New Product</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <select id="pCategory">
            <option value="General">General Stock</option>
            <option value="Hardware">Hardware</option>
            <option value="Electronics">Electronics</option>
        </select>
        <input type="number" id="pQty" placeholder="Quantity">
        <input type="number" id="pPrice" placeholder="Price per Unit">
        <button class="btn-save" onclick="saveProduct()">✅ Save Product</button>
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-export" onclick="window.print()" style="background: #7f8c8d; color: white;">🖨️ Print</button>
            <button class="btn-export" onclick="exportTableToCSV()">📊 Export to Excel</button>
        </div>
    </div>

    <div style="overflow-x: auto;">
        <table id="inventory-table">
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th class="no-print">Action</th>
                    <th class="no-print">Order</th>
                </tr>
            </thead>
            <tbody id="inventory-body">
                </tbody>
        </table>
    </div>
</div>

<div id="toast">Message here</div>

<script>
    // 1. PAGE LOAD LOGIC
    window.onload = function() {
        let name = prompt("Enter your name:");
        document.getElementById("user-name-display").innerText = name || "Manager";
        
        if(localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            document.getElementById("darkModeToggle").innerText = "☀️";
        }
        renderTable(); 
    };

    // 2. SHOW NOTIFICATION
    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
    }

    // 3. RENDER TABLE
    function renderTable() {
        const products = JSON.parse(localStorage.getItem("myInventory")) || [];
        const tbody = document.getElementById("inventory-body");
        tbody.innerHTML = ""; 

        products.forEach((p, index) => {
            const row = tbody.insertRow();
            const waLink = `https://wa.me/254112873218?text=Order:${p.name}+Qty:${p.qty}`;

            row.innerHTML = `
                <td><img src="unnamed_1.jpg" style="width:40px; border-radius:4px;"></td>
                <td>${p.name}</td>
                <td>${p.cat}</td>
                <td>${p.date}</td>
                <td>${p.qty}</td>
                <td>${p.price}</td>
                <td class="no-print"><button class="delete-btn" onclick="removeRow(${index})">Del</button></td>
                <td class="no-print"><a href="${waLink}" target="_blank" class="order-btn">Order</a></td>
            `;
        });
        updateDashboard();
    }

    // 4. SAVE DATA
    function saveProduct() {
        const name = document.getElementById("pName").value;
        const cat = document.getElementById("pCategory").value;
        const qty = document.getElementById("pQty").value;
        const price = document.getElementById("pPrice").value;
        const date = new Date().toLocaleDateString('en-GB');

        if (!name || !qty || !price) {
            alert("Fill all fields!");
            return;
        }

        let products = JSON.parse(localStorage.getItem("myInventory")) || [];
        products.push({ name, cat, qty, price, date });
        localStorage.setItem("myInventory", JSON.stringify(products));

        // Clear inputs
        document.getElementById("pName").value = "";
        document.getElementById("pQty").value = "";
        document.getElementById("pPrice").value = "";

        renderTable();
        showToast("Saved to Memory! ✅");
    }

    // 5. EXPORT TO EXCEL
    function exportTableToCSV() {
        let products = JSON.parse(localStorage.getItem("myInventory")) || [];
        let csv = "Product,Category,Date,Qty,Price,Total\n";
        products.forEach(p => {
            csv += `"${p.name}","${p.cat}","${p.date}","${p.qty}","${p.price}","${p.qty * p.price}"\n`;
        });
        let blob = new Blob([csv], { type: "text/csv" });
        let url = window.URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = "Inventory_Report.csv";
        a.click();
        showToast("Excel File Ready! 📊");
    }

    // 6. DELETE LOGIC
    function removeRow(index) {
        let products = JSON.parse(localStorage.getItem("myInventory")) || [];
        products.splice(index, 1);
        localStorage.setItem("myInventory", JSON.stringify(products));
        renderTable();
        showToast("Item Removed");
    }

    // 7. DASHBOARD LOGIC
    function updateDashboard() {
        const products = JSON.parse(localStorage.getItem("myInventory")) || [];
        let totalVal = 0;
        products.forEach(p => { totalVal += (p.qty * p.price); });
        document.getElementById("total-items-count").innerText = products.length;
        document.getElementById("total-value-count").innerText = "KES " + totalVal.toLocaleString();
    }

    // 8. DARK MODE
    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        document.getElementById("darkModeToggle").innerText = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
    }
</script>

</body>
    </html>
