<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Master Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --primary: #1e272e; --secondary: #d4af37; --bg: #f4f7f6;
            --card: #ffffff; --text: #2c3e50; --accent: #dcdde1; --danger: #c23616;
        }
        /* DARK MODE DEFINITION */
        [data-theme="dark"] {
            --bg: #13171a; --card: #1e272e; --text: #f5f6fa; --accent: #353b48;
        }

        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.4s; overflow-x: hidden; }
        
        #role-banner { background: var(--secondary); color: var(--primary); text-align: center; padding: 10px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: none; }

        nav { background: var(--primary); padding: 15px 5%; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--secondary); }
        .nav-brand { font-size: 1.5rem; font-weight: 800; color: var(--secondary); letter-spacing: 2px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-item { cursor: pointer; color: #fff; opacity: 0.7; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; padding: 5px; }
        .nav-item.active { opacity: 1; color: var(--secondary); border-bottom: 2px solid var(--secondary); }

        #auth-overlay { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 4px; width: 90%; max-width: 380px; text-align: center; border-top: 5px solid var(--secondary); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }

        .container { max-width: 950px; margin: 1.5rem auto; padding: 0 20px; display: none; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 25px; border-radius: 4px; border-left: 4px solid var(--secondary); margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .admin-only, .staff-only { display: none; } 

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .stat-box { padding: 25px; background: var(--primary); color: var(--secondary); text-align: center; border-radius: 4px; border: 1px solid var(--secondary); }
        .stat-box h2 { font-size: 1.6rem; margin: 5px 0; color: #fff; }

        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 16px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 800; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn-main { background: var(--secondary); color: var(--primary); }
        .btn-wa { background: #25D366; color: white; margin-top: 20px; }
        .btn-guest { background: var(--accent); color: var(--primary); margin-top: 20px; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--secondary); border-bottom: 2px solid var(--secondary); font-size: 0.75rem; }
        td { padding: 15px; border-bottom: 1px solid var(--accent); font-size: 0.9rem; }
        
        .badge { padding: 5px 10px; font-size: 0.65rem; font-weight: 800; border: 1px solid; border-radius: 2px; }
        .badge-low { border-color: var(--danger); color: var(--danger); }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--secondary); padding: 15px 35px; display: none; border: 1px solid var(--secondary); z-index: 10001; }
    </style>
</head>
<body data-theme="light">

    <div id="role-banner">ACTIVE SESSION: <span id="display-role">GUEST</span></div>

    <div id="auth-overlay">
        <div class="auth-card">
            <h1 style="color:var(--primary); margin:0;">STOCKPRO</h1>
            <p style="font-size:0.6rem; letter-spacing:2px; margin-bottom:25px; opacity:0.7;">ENTERPRISE INVENTORY SUITE</p>
            
            <input type="text" id="login-user" placeholder="Username (Admin/Staff)">
            <input type="password" id="login-pass" placeholder="Access Key">
            <button class="btn btn-main" onclick="handleAuth()">Login</button>
            
            <button class="btn btn-guest" onclick="enterAs('Guest')">Continue as Guest</button>
            <p style="font-size:0.6rem; opacity:0.5; margin-top:15px;">Admin: admin / 1234 | Staff: staff / staff</p>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-brand">STOCKPRO</div>
        <div class="nav-links">
            <div class="nav-item active" onclick="nav('dashboard', event)">Overview</div>
            <div class="nav-item" onclick="nav('inventory', event)">Ledger</div>
            <div class="nav-item" onclick="nav('reports', event)">Reports</div>
            <div class="nav-item" onclick="toggleDarkMode()"><i class="fas fa-moon" id="theme-icon"></i></div>
        </div>
    </nav>

    <div class="container" id="app-body">
        
        <section id="page-dashboard" class="page active">
            <div class="admin-only stats-grid">
                <div class="stat-box"><small>CAPITAL</small><h2 id="stat-val">KES 0</h2></div>
                <div class="stat-box"><small>SKUs</small><h2 id="stat-items">0</h2></div>
            </div>

            <div class="admin-only card">
                <h3 style="margin:0 0 15px 0; font-size:0.9rem;">Distribution Analytics</h3>
                <div style="height: 250px;"><canvas id="categoryChart"></canvas></div>
            </div>

            <div class="staff-only card">
                <h3>Asset Entry</h3>
                <div id="reader" style="display:none; margin-bottom:10px;"></div>
                <button class="btn" style="background:var(--primary); color:var(--secondary); border:1px solid var(--secondary);" onclick="toggleScanner()">
                    <i class="fas fa-camera"></i> Scan Barcode
                </button>
                <input type="text" id="p-name" placeholder="Item Name">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="p-qty" placeholder="Qty">
                    <input type="number" id="p-price" placeholder="Price" class="admin-only">
                </div>
                <select id="p-cat">
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Materials">Materials</option>
                </select>
                <button class="btn btn-main" onclick="addItem()">Commit to Ledger</button>
            </div>
        </section>

        <section id="page-inventory" class="page">
            <div class="card">
                <input type="text" id="search" placeholder="Search by name or category..." onkeyup="renderTable()">
                <div style="overflow-x:auto;">
                    <table>
                        <thead><tr><th>Description</th><th>Stock</th><th class="admin-only">Value</th><th>Action</th></tr></thead>
                        <tbody id="stock-table"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="page-reports" class="page">
            <div class="card" onclick="exportPDF()" style="cursor:pointer">
                <h4><i class="fas fa-file-pdf"></i> Generate Master Audit (PDF)</h4>
            </div>
            
            <div class="admin-only card" onclick="exportCSV()" style="cursor:pointer">
                <h4><i class="fas fa-file-csv"></i> Export Spreadsheet (CSV)</h4>
            </div>
            
            <button class="btn btn-wa" onclick="sendWA()"><i class="fab fa-whatsapp"></i> Broadcast to Manager</button>
        </section>
    </div>

    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        let inventory = JSON.parse(localStorage.getItem('sp_final_vault')) || [];
        let currentUser = 'Guest';
        let myChart = null;
        let html5QrCode = null;

        function handleAuth() {
            const u = document.getElementById('login-user').value.toLowerCase();
            const p = document.getElementById('login-pass').value;
            if (u === 'admin' && p === '1234') enterAs('Admin');
            else if (u === 'staff' && p === 'staff') enterAs('Staff');
            else alert("Denied");
        }

        function enterAs(role) {
            currentUser = role;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('app-body').style.display = 'block';
            document.getElementById('role-banner').style.display = 'block';
            document.getElementById('display-role').innerText = role;

            if(role === 'Admin') {
                document.querySelectorAll('.admin-only, .staff-only').forEach(e => e.style.display = 'block');
                initChart();
            } else if(role === 'Staff') {
                document.querySelectorAll('.staff-only').forEach(e => e.style.display = 'block');
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'none');
            } else {
                document.querySelectorAll('.admin-only, .staff-only').forEach(e => e.style.display = 'none');
            }
            refresh();
        }

        /* --- THEME TOGGLE (DARK MODE) --- */
        function toggleDarkMode() {
            const b = document.body;
            const icon = document.getElementById('theme-icon');
            const isDark = b.getAttribute('data-theme') === 'dark';
            
            b.setAttribute('data-theme', isDark ? 'light' : 'dark');
            icon.classList.toggle('fa-moon', !isDark);
            icon.classList.toggle('fa-sun', isDark);
            
            if(myChart) {
                myChart.options.plugins.legend.labels.color = isDark ? '#2c3e50' : '#ffffff';
                myChart.update();
            }
        }

        /* --- CSV EXPORT --- */
        function exportCSV() {
            if(inventory.length === 0) return toast("No data to export");
            let csv = "Asset,Category,Quantity,UnitPrice,Timestamp\n";
            inventory.forEach(i => {
                csv += `${i.name},${i.cat},${i.qty},${i.price},${i.time}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'StockPro_MasterLedger.csv'; a.click();
            toast("CSV Sync Complete");
        }

        /* --- PDF EXPORT --- */
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("StockPro Enterprise Audit", 14, 15);
            doc.autoTable({ 
                head: [['Item', 'Cat', 'Qty', 'Price']], 
                body: inventory.map(i => [i.name, i.cat, i.qty, i.price]) 
            });
            doc.save('Audit_Report.pdf');
        }

        /* --- WHATSAPP --- */
        function sendWA() {
            let msg = `*STOCKPRO SUMMARY*%0AInventory Update:%0A`;
            inventory.forEach(i => msg += `• ${i.name}: ${i.qty}%0A`);
            window.open(`https://wa.me/254112873218?text=${msg}`);
        }

        /* --- CORE LOGIC --- */
        function addItem() {
            const n = document.getElementById('p-name').value;
            const q = parseInt(document.getElementById('p-qty').value);
            const p = parseFloat(document.getElementById('p-price').value) || 0;
            if(!n || isNaN(q)) return toast("Check Inputs");

            inventory.push({ id: Date.now(), name: n, qty: q, price: p, cat: document.getElementById('p-cat').value, time: new Date().toLocaleString() });
            localStorage.setItem('sp_final_vault', JSON.stringify(inventory));
            refresh(); updateChart();
            ['p-name','p-qty','p-price'].forEach(id => document.getElementById(id).value = '');
        }

        function renderTable() {
            const body = document.getElementById('stock-table');
            const query = document.getElementById('search').value.toLowerCase();
            body.innerHTML = '';
            
            inventory.filter(i => i.name.toLowerCase().includes(query) || i.cat.toLowerCase().includes(query)).forEach(i => {
                body.innerHTML += `
                    <tr>
                        <td><strong>${i.name.toUpperCase()}</strong><br><small>${i.time}</small></td>
                        <td><span class="badge ${i.qty < 5 ? 'badge-low' : ''}">${i.qty} UNITS</span></td>
                        <td class="admin-only">KES ${i.price.toLocaleString()}</td>
                        <td>
                            ${currentUser === 'Admin' ? `<i class="fas fa-trash" style="color:var(--danger); cursor:pointer" onclick="deleteItem(${i.id})"></i>` : `<i class="fas fa-lock" style="opacity:0.2"></i>`}
                        </td>
                    </tr>`;
            });
            if(currentUser === 'Admin') document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'table-cell');
        }

        function deleteItem(id) {
            if(confirm("Confirm deletion?")) {
                inventory = inventory.filter(i => i.id !== id);
                localStorage.setItem('sp_final_vault', JSON.stringify(inventory));
                refresh(); updateChart();
            }
        }

        function refresh() {
            renderTable();
            const val = inventory.reduce((s, i) => s + (i.qty * i.price), 0);
            document.getElementById('stat-val').innerText = `KES ${val.toLocaleString()}`;
            document.getElementById('stat-items').innerText = inventory.length;
        }

        function initChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Hardware', 'Software', 'Materials'], datasets: [{ data: [0,0,0], backgroundColor: ['#d4af37', '#1e272e', '#353b48'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
            updateChart();
        }

        function updateChart() {
            if(!myChart) return;
            const cats = ['Hardware', 'Software', 'Materials'];
            myChart.data.datasets[0].data = cats.map(c => inventory.filter(i => i.cat === c).length);
            myChart.update();
        }

        function nav(p, e) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            e.target.classList.add('active');
        }

        function toggleScanner() {
            const r = document.getElementById('reader');
            if (!html5QrCode) {
                r.style.display = 'block';
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                (text) => { document.getElementById('p-name').value = text; toggleScanner(); });
            } else {
                html5QrCode.stop().then(() => { html5QrCode = null; r.style.display = 'none'; });
            }
        }

        function toast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
    </script>
</body>
            </html>
