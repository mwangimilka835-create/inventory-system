    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS | Professional Inventory System</title>
    <style>
        /* Styling for the Action Buttons */
.btn-order {
    background-color: #25D366; /* WhatsApp Green */
    color: white;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
}

.btn-delete {
    background-color: #ff4757; /* Professional Red */
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
}

.btn-order:hover, .btn-delete:hover {
    opacity: 0.8;
    transform: scale(1.05);
}
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --accent: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        .dark-mode {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --primary: #3b82f6;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            transition: 0.3s;
        }

        /* NAVIGATION */
        nav {
            background: #1e293b;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            transition: 0.2s;
        }

        nav a.active { background: var(--primary); color: white; }
        nav a:hover:not(.active) { color: white; background: rgba(255,255,255,0.1); }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* DASHBOARD CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .stat-card h3 { margin: 0; font-size: 0.875rem; color: var(--secondary); text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        /* SEARCH BAR */
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: var(--card);
            color: var(--text);
        }

        /* FORM */
        .form-group {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: var(--bg);
            color: var(--text);
        }

        button {
            cursor: pointer;
            border: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-main { background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; width: 100%; }
        .btn-main:hover { opacity: 0.9; transform: translateY(-1px); }

        /* TABLE */
        .table-container {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        table { width: 100%; border-collapse: collapse; }
        thead th { background: #1e293b; color: #f59e0b; padding: 15px; text-align: left; font-size: 0.75rem; text-transform: uppercase; }
        tbody td { padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); }

        .low-stock { color: var(--danger); font-weight: bold; background: rgba(239, 68, 68, 0.1); }

        /* UTILS */
        .no-print { display: block; }
        @media print { .no-print { display: none !important; } }

        #toast {
            visibility: hidden;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 20px; opacity: 1;} }
    </style>
</head>
<body>

<nav class="no-print">
    <a id="nav-dashboard" onclick="showSection('dashboard')" class="active">📊 DASHBOARD</a>
    <a id="nav-inventory" onclick="showSection('inventory')">📦 INVENTORY</a>
    <a id="nav-add" onclick="showSection('add')">➕ ADD ITEM</a>
</nav>

<div class="container">
    <header>
        <h1>Inventory System</h1>
        <button onclick="toggleDarkMode()" id="theme-btn" style="background:none; border:none; font-size:24px; cursor:pointer;">🌙</button>
    </header>

    <div id="dashboard-section">
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Products</h3><p id="stat-count">0</p></div>
            <div class="stat-card"><h3>Total Value</h3><p id="stat-value">KES 0</p></div>
            <div class="stat-card"><h3>Low Stock Items</h3><p id="stat-low" style="color:var(--danger)">0</p></div>
        </div>
        <div style="text-align:center; padding: 2rem; background: var(--card); border-radius: 12px;">
            <p>Welcome to your portfolio-grade inventory management system.</p>
        </div>
    </div>

    <div id="add-section" style="display:none;">
        <div class="form-group">
            <h2>Add New Product</h2>
            <label>Product Name</label>
            <input type="text" id="pName" placeholder="e.g. Wireless Mouse">
            <label>Category</label>
            <select id="pCategory">
                <option value="Electronics">Electronics</option>
                <option value="Office">Office Supplies</option>
                <option value="Furniture">Furniture</option>
            </select>
            <label>Quantity</label>
            <input type="number" id="pQty" placeholder="0">
            <label>Unit Price (KES)</label>
            <input type="number" id="pPrice" placeholder="0.00">
            <button class="btn-main" onclick="saveProduct()">Save Product to Database</button>
        </div>
    </div>

    <div id="inventory-section" style="display:none;">
        <input type="text" class="search-box no-print" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Search by product name...">
        
        <div class="no-print" style="margin-bottom: 1rem; display: flex; gap: 10px;">
            <button onclick="window.print()" style="padding: 10px; border-radius: 6px; background: #64748b; color: white;">🖨️ Print PDF</button>
            <button onclick="exportCSV()" style="padding: 10px; border-radius: 6px; background: #2563eb; color: white;">📊 Export CSV</button>
        </div>

        <div class="table-container">
            <table id="inventoryTable">
                <thead>
    <tr>
        <th>Added Date</th>
        <th>Product</th>
        <th>Category</th>
        <th>Qty</th>
        <th>Price</th>
        <th class="no-print">Actions</th> </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast">Notification</div>

<script>
    // CORE LOGIC
    window.onload = () => {
        if(localStorage.getItem("ims-theme") === "dark") toggleDarkMode();
        showSection('dashboard');
    };

    function showSection(id) {
        // Handle nav active states
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById('nav-' + id).classList.add('active');

        // Handle section visibility
        document.getElementById('dashboard-section').style.display = 'none';
        document.getElementById('add-section').style.display = 'none';
        document.getElementById('inventory-section').style.display = 'none';
        document.getElementById(id + '-section').style.display = 'block';

        updateStats();
        renderTable();
    }

    function saveProduct() {
        const name = document.getElementById("pName").value;
        const cat = document.getElementById("pCategory").value;
        const qty = parseInt(document.getElementById("pQty").value);
        const price = parseFloat(document.getElementById("pPrice").value);
        const date = new Date().toLocaleDateString();

        if (!name || isNaN(qty) || isNaN(price)) {
            alert("Please fill all fields correctly.");
            return;
        }

        let db = JSON.parse(localStorage.getItem("ims_db")) || [];
        db.push({ name, cat, qty, price, date });
        localStorage.setItem("ims_db", JSON.stringify(db));

        // Reset inputs
        document.getElementById("pName").value = "";
        document.getElementById("pQty").value = "";
        document.getElementById("pPrice").value = "";

        showToast("Product saved successfully!");
        showSection('inventory');
    }
function renderTable() {
    const db = JSON.parse(localStorage.getItem("ims_db")) || [];
    const tbody = document.getElementById("inventory-body");
    tbody.innerHTML = "";

    db.forEach((item, index) => {
        const isLow = item.qty < 5;
        const row = tbody.insertRow();
        if(isLow) row.className = "low-stock";

        // This creates the WhatsApp message automatically
        const whatsappMsg = window.encodeURIComponent(`Hello, I would like to order: ${item.name} (Qty: ${item.qty})`);

        row.innerHTML = `
            <td>${item.date}</td>
            <td><strong>${item.name}</strong></td>
            <td>${item.cat}</td>
            <td>${item.qty} ${isLow ? '⚠️' : ''}</td>
            <td>KES ${item.price.toLocaleString()}</td>
            <td class="no-print" style="display: flex; gap: 8px;">
                <a href="https://wa.me/254112873218?text=${whatsappMsg}" 
                   target="_blank" 
                   style="background:#25D366; color:white; padding:5px 10px; border-radius:4px; text-decoration:none; font-size:12px; font-weight:bold;">
                   Order
                </a>
                <button onclick="deleteItem(${index})" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;">
                   Del
                </button>
            </td>
        `;
    });
    }
    
    function updateStats() {
        const db = JSON.parse(localStorage.getItem("ims_db")) || [];
        let totalVal = 0;
        let lowStockCount = 0;

        db.forEach(item => {
            totalVal += (item.qty * item.price);
            if(item.qty < 5) lowStockCount++;
        });

        document.getElementById("stat-count").innerText = db.length;
        document.getElementById("stat-value").innerText = "KES " + totalVal.toLocaleString();
        document.getElementById("stat-low").innerText = lowStockCount;
    }

    function deleteItem(index) {
        if(confirm("Permanently delete this item?")) {
            let db = JSON.parse(localStorage.getItem("ims_db")) || [];
            db.splice(index, 1);
            localStorage.setItem("ims_db", JSON.stringify(db));
            renderTable();
            updateStats();
        }
    }

    function filterTable() {
        let input = document.getElementById("searchInput").value.toUpperCase();
        let tr = document.getElementById("inventoryTable").getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let td = tr[i].getElementsByTagName("td")[1]; // Product name column
            if (td) {
                let textValue = td.textContent || td.innerText;
                tr[i].style.display = textValue.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }
    }

    function toggleDarkMode() {
        const isDark = document.body.classList.toggle("dark-mode");
        document.getElementById("theme-btn").innerText = isDark ? "☀️" : "🌙";
        localStorage.setItem("ims-theme", isDark ? "dark" : "light");
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    function exportCSV() {
        const db = JSON.parse(localStorage.getItem("ims_db")) || [];
        let csv = "Date,Product,Category,Qty,Price\n";
        db.forEach(i => csv += `${i.date},${i.name},${i.cat},${i.qty},${i.price}\n`);
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'inventory_report.csv';
        a.click();
    }
</script>

</body>
            </html>
