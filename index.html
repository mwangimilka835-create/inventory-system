<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1c40f; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .welcome-box { border-left: 6px solid #2980b9; padding-left: 15px; margin-bottom: 25px; color: #34495e; }
        .stats { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-box { flex: 1; padding: 15px; border-radius: 10px; color: white; text-align: center; }
        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; transition: 0.3s; }
        .add-btn { background: #27ae60; color: white; }
        .add-btn:hover { background: #219150; }
        .print-btn { background: #34495e; color: white; }
        .export-btn { background: #2980b9; color: white; }
        .delete-btn { background: #e74c3c; color: white; padding: 6px 12px; width: auto; margin: 0; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .no-print { display: table-cell; }
        @media print { .no-print, .add-btn, .print-btn, .export-btn, input, select, h3, .welcome-box, #searchInput { display: none !important; } body { background: white; } .container { box-shadow: none; width: 100%; max-width: 100%; } table { border: 1px solid #000; } th, td { border: 1px solid #000 !important; } }
    </style>
</head>
<body>

<div class="header">
    <h1>Inventory Management System</h1>
</div>

<div class="container">
    <div class="header">
    <div style="background: white; padding: 5px; border-radius: 12px; margin-top: 15px;">
        <img src="unnamed_1.jpg" alt="Shop Banner" style="width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; display: block;">
    </div>
    </div>
    <div class="header">

    <div class="welcome-box">
        <h2>Welcome, <span id="user-name-display">Guest</span>! 👋</h2>
        <p>Keep track of your stock and business value.</p>
    </div>

    <div class="stats">
        <div class="stat-box" style="background: #27ae60;">
            <small>Total Items</small>
            <h3 id="total-items-count">0</h3>
        </div>
        <div class="stat-box" style="background: #e67e22;">
            <small>Total Value</small>
            <h3 id="total-value-count">KES 0</h3>
        </div>
    </div>

    <h3>Add New Product</h3>
    <input type="text" id="pName" placeholder="Product Name (e.g. Milk, Keyboard)">
    <select id="pCategory">
        <option value="General">📦 General Stock</option>
        <option value="Bakery">🍞 Bakery Items</option>
        <option value="Dairy">🥛 Dairy & Poultry</option>
        <option value="Electronics">🔌 Electronics/ICT</option>
        <option value="Drinks">🥤 Beverages</option>
    </select>
    <input type="number" id="pQty" placeholder="Quantity">
    <input type="number" id="pPrice" placeholder="Price (KES)">

    <button type="button" class="add-btn" onclick="saveProduct()">✅ Save Product</button>
    <button type="button" class="print-btn" onclick="window.print()">🖨️ Print Report</button>
    <button type="button" class="export-btn" onclick="exportTableToCSV('Stock_Report.csv')">📊 Export to Excel</button>

    <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="🔍 Search products..." style="border: 2px solid #2980b9;">

    <table id="inventory-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Qty</th>
                <th>Price</th>
                <th class="no-print">Action</th>
                <th class="no-print">Order</th> </tr>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<footer style="text-align: center; margin-top: 30px; color: #7f8c8d; font-size: 13px;">
    <p>© 2026 Inventory Management System | Designed by Milka Mumbi</p>
</footer>

<script>
    // 1. POPUP NAME
    window.onload = function() {
        let name = prompt("Please enter your name:");
        if (!name) name = "User";
        document.getElementById("user-name-display").innerText = name;
    };

    // 2. SAVE PRODUCT
    function saveProduct() {
    let name = document.getElementById("pName").value;
    let cat = document.getElementById("pCategory").value;
    let qty = document.getElementById("pQty").value;
    let price = document.getElementById("pPrice").value;

    if (name === "" || qty === "" || price === "") {
        alert("Please fill in all fields!");
        return;
    }

    let table = document.getElementById("inventory-table").getElementsByTagName('tbody')[0];
    let row = table.insertRow();
    
    // 1. Photo Cell
 row.insertCell(0).innerHTML = '<img src="unnamed.jpg" style="width:50px; height:50px; object-fit:cover; border-radius:5px;">';

    // 2. Product Info
    row.insertCell(1).innerText = name;
    row.insertCell(2).innerText = qty;
    row.insertCell(3).innerText = "KES " + price;

    // 3. Delete Button
    row.insertCell(4).innerHTML = '<button class="delete-btn no-print" onclick="removeRow(this)">Delete</button>';

    // 4. WHATSAPP ORDER BUTTON (THE MAGIC!)
    let myNumber = "254112873218"; // <--- CHANGE THIS TO YOUR NUMBER!
    let message = `Hello Milka, I would like to order ${qty} units of ${name}. Total: KES ${qty * price}`;
    let encodedMsg = encodeURIComponent(message);
    
    row.insertCell(5).innerHTML = `
        <a href="https://wa.me/${myNumber}?text=${encodedMsg}" target="_blank" class="no-print">
            <button style="background: #25D366; color: white; padding: 6px 12px; width: auto; font-size: 14px; border: none; border-radius: 5px;">
                Order via WhatsApp
            </button>
        </a>`;

    // Clear Inputs
    document.getElementById("pName").value = "";
    document.getElementById("pQty").value = "";
    document.getElementById("pPrice").value = "";

    updateDashboard();
    }

    // 3. REMOVE ROW
    function removeRow(btn) {
        btn.parentElement.parentElement.remove();
        updateDashboard();
    }

    // 4. UPDATE DASHBOARD & COLORS
    function updateDashboard() {
        let tbody = document.getElementById("inventory-table").getElementsByTagName('tbody')[0];
        let rows = tbody.getElementsByTagName('tr');
        let totalVal = 0;

        for (let i = 0; i < rows.length; i++) {
            let q = parseFloat(rows[i].cells[2].innerText) || 0;
            let p = parseFloat(rows[i].cells[3].innerText) || 0;

            // Low Stock Warning
            if (q < 5) {
                rows[i].style.backgroundColor = "#ff7675";
                rows[i].style.color = "white";
            } else {
                rows[i].style.backgroundColor = "white";
                rows[i].style.color = "black";
            }
            totalVal += (q * p);
        }

        document.getElementById("total-items-count").innerText = rows.length;
        document.getElementById("total-value-count").innerText = "KES " + totalVal.toLocaleString();
    }

    // 5. SEARCH
    function searchTable() {
        let input = document.getElementById("searchInput").value.toUpperCase();
        let tr = document.getElementById("inventory-table").getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let td = tr[i].getElementsByTagName("td")[0];
            if (td) {
                let txt = td.textContent || td.innerText;
                tr[i].style.display = txt.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }
    }

    // 6. EXCEL EXPORT
    function exportTableToCSV(filename) {
        let csv = [];
        let rows = document.querySelectorAll("table tr");
        for (let i = 0; i < rows.length; i++) {
            let row = [], cols = rows[i].querySelectorAll("td, th");
            for (let j = 0; j < cols.length - 1; j++) {
                row.push('"' + cols[j].innerText + '"');
            }
            csv.push(row.join(","));
        }
        let csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
        let downloadLink = document.createElement("a");
        downloadLink.download = filename;
        downloadLink.href = window.URL.createObjectURL(csvFile);
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }
</script>

</body>
</html>
