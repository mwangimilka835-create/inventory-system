<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Executive Suite</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- EXECUTIVE COLOR PALETTE --- */
        :root {
            --primary: #1e272e; /* Deep Midnight Navy */
            --secondary: #d4af37; /* Champagne Gold */
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #2c3e50;
            --accent: #dcdde1;
            --danger: #c23616;
        }

        [data-theme="dark"] {
            --bg: #13171a; 
            --card: #1e272e; 
            --text: #f5f6fa;
            --accent: #353b48;
        }

        body { 
            font-family: 'Georgia', 'Times New Roman', serif; /* Classic Serif for a high-end feel */
            background: var(--bg); color: var(--text); margin: 0; 
            transition: 0.5s ease; overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav { 
            background: var(--primary); padding: 25px 5%; display: none; 
            flex-direction: column; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100;
        }
        .nav-brand { 
            font-size: 2.2rem; font-weight: 800; color: var(--secondary);
            letter-spacing: 2px; text-transform: uppercase;
        }
        .nav-links { display: flex; justify-content: center; gap: 15px; width: 100%; flex-wrap: wrap; }
        .nav-item { 
            cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: 0.3s; 
            color: #f5f6fa; opacity: 0.6; padding: 10px 20px; border: 1px solid transparent;
        }
        .nav-item.active { opacity: 1; border-bottom: 2px solid var(--secondary); color: var(--secondary); }

        /* --- AUTHENTICATION --- */
        #auth-overlay {
            position: fixed; inset: 0; background: var(--primary);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .auth-card {
            background: var(--card); padding: 50px; border-radius: 5px; 
            width: 85%; max-width: 400px; text-align: center;
            border-top: 5px solid var(--secondary);
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        /* --- LAYOUT --- */
        .container { max-width: 900px; margin: 3rem auto; padding: 0 20px; display: none; }
        .page { display: none; animation: fadeIn 0.8s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { 
            background: var(--card); padding: 30px; border-radius: 4px; 
            border-left: 4px solid var(--secondary); margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* --- DASHBOARD STATS --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { 
            padding: 25px; background: var(--primary); color: var(--secondary); 
            text-align: center; border-radius: 4px;
        }
        .stat-box h2 { font-size: 1.8rem; margin: 5px 0; color: #fff; }

        /* --- INPUTS & BUTTONS --- */
        input, select { 
            width: 100%; padding: 15px; margin: 10px 0; border: 1px solid var(--accent); 
            background: var(--bg); color: var(--text); font-size: 16px; box-sizing: border-box;
        }
        .btn { 
            padding: 16px; border: none; cursor: pointer; text-transform: uppercase;
            font-weight: 700; letter-spacing: 1px; width: 100%; transition: 0.3s;
        }
        .btn-main { background: var(--secondary); color: var(--primary); }
        .btn-main:hover { background: #b8962d; }
        
        /* --- TABLES --- */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--secondary); border-bottom: 2px solid var(--secondary); }
        td { padding: 15px; border-bottom: 1px solid var(--accent); }
        
        .badge { padding: 5px 10px; font-size: 0.7rem; font-weight: 800; border: 1px solid; }
        .badge-low { border-color: var(--danger); color: var(--danger); }
        .badge-ok { border-color: var(--secondary); color: var(--secondary); }

        #toast { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: var(--secondary); padding: 15px 40px; 
            display: none; border: 1px solid var(--secondary);
        }
    </style>
</head>
<body data-theme="light">

    <div id="auth-overlay">
        <div class="auth-card" id="setup-box">
            <h1 style="color:var(--primary); margin:0;">STOCKPRO</h1>
            <p style="letter-spacing:2px; font-size:0.8rem; margin-bottom:30px;">EXECUTIVE INVENTORY SYSTEM</p>
            <input type="text" id="reg-fname" placeholder="First Name">
            <input type="password" id="reg-pass" placeholder="Master Password">
            <button class="btn btn-main" onclick="register()">Initialize System</button>
        </div>
        <div class="auth-card" id="login-box" style="display: none;">
            <h2 id="greet-user">Welcome, Admin</h2>
            <input type="password" id="login-pass" placeholder="Enter Credentials">
            <button class="btn btn-main" onclick="login()">Access Vault</button>
            <p onclick="resetApp()" style="font-size: 0.7rem; opacity: 0.3; margin-top: 20px; cursor: pointer;">System Reset</p>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-brand">STOCKPRO</div>
        <div class="nav-links">
            <div class="nav-item active" onclick="nav('dashboard', event)">Overview</div>
            <div class="nav-item" onclick="nav('inventory', event)">Assets</div>
            <div class="nav-item" onclick="nav('reports', event)">Ledger</div>
            <div class="nav-item" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></div>
            <div class="nav-item" style="color: var(--danger);" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i></div>
        </div>
    </nav>

    <div class="container" id="app-body">
        
        <section id="page-dashboard" class="page active">
            <div class="stats-grid">
                <div class="stat-box">
                    <small>VALUATION</small>
                    <h2 id="stat-val">KES 0</h2>
                </div>
                <div class="stat-box">
                    <small>TOTAL SKUs</small>
                    <h2 id="stat-items">0</h2>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top:0">Asset Registration</h3>
                <input type="text" id="p-name" placeholder="Item Name">
                <select id="p-cat">
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="General">General</option>
                </select>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="p-qty" placeholder="Quantity">
                    <input type="number" id="p-price" placeholder="Unit Price">
                </div>
                <button class="btn btn-main" onclick="addItem()">Commit to Ledger</button>
            </div>
        </section>

        <section id="page-inventory" class="page">
            <div class="card">
                <input type="text" id="search" placeholder="Search Assets..." onkeyup="renderTable()">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Asset</th><th>Status</th><th>Value</th><th></th></tr></thead>
                        <tbody id="stock-table"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="page-reports" class="page">
            <h2 style="text-align:center; letter-spacing:3px;">EXPORT CENTER</h2>
            <div class="card" style="cursor:pointer;" onclick="exportPDF()">
                <h4 style="margin:0"><i class="fas fa-file-invoice"></i> Download PDF Audit</h4>
            </div>
            <div class="card" style="cursor:pointer;" onclick="exportCSV()">
                <h4 style="margin:0"><i class="fas fa-file-csv"></i> Sync CSV Ledger</h4>
            </div>
            <div class="card" style="cursor:pointer;" onclick="sendWA()">
                <h4 style="margin:0"><i class="fab fa-whatsapp"></i> Notify Headquarters</h4>
            </div>
        </section>
    </div>

    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        let inventory = JSON.parse(localStorage.getItem('sp_exec_data')) || [];
        let account = JSON.parse(localStorage.getItem('sp_exec_acc'));

        window.onload = () => {
            if(account) {
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('login-box').style.display = 'block';
                document.getElementById('greet-user').innerText = `Admin: ${account.fname}`;
            }
            if(localStorage.getItem('theme') === 'dark') toggleDarkMode();
        };

        function register() {
            const f = document.getElementById('reg-fname').value;
            const p = document.getElementById('reg-pass').value;
            if(!f || !p) return alert("All fields required");
            account = { fname: f, pass: p };
            localStorage.setItem('sp_exec_acc', JSON.stringify(account));
            start();
        }

        function login() {
            if(document.getElementById('login-pass').value === account.pass) start();
            else alert("Access Denied");
        }

        function start() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('app-body').style.display = 'block';
            refresh();
        }

        function nav(p, e) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(e) e.target.classList.add('active');
        }

        function toggleDarkMode() {
            const b = document.body;
            const isDark = b.getAttribute('data-theme') === 'dark';
            b.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        function addItem() {
            const n = document.getElementById('p-name').value;
            const q = parseInt(document.getElementById('p-qty').value);
            const p = parseFloat(document.getElementById('p-price').value);
            if(!n || isNaN(q)) return toast("Check Ledger Details");

            inventory.push({ id: Date.now(), name: n, cat: document.getElementById('p-cat').value, qty: q, price: p });
            save(); toast("Record Committed");
            ['p-name','p-qty','p-price'].forEach(id => document.getElementById(id).value = '');
        }

        function deleteItem(id) {
            inventory = inventory.filter(i => i.id !== id);
            save(); toast("Record Purged");
        }

        function save() {
            localStorage.setItem('sp_exec_data', JSON.stringify(inventory));
            refresh();
        }

        function refresh() {
            renderTable();
            const val = inventory.reduce((s, i) => s + (i.qty * i.price), 0);
            document.getElementById('stat-val').innerText = `KES ${val.toLocaleString()}`;
            document.getElementById('stat-items').innerText = inventory.length;
        }

        function renderTable() {
            const body = document.getElementById('stock-table');
            const search = document.getElementById('search').value.toLowerCase();
            body.innerHTML = '';
            
            inventory.filter(i => i.name.toLowerCase().includes(search)).forEach(i => {
                const bClass = i.qty < 5 ? 'badge-low' : 'badge-ok';
                body.innerHTML += `
                    <tr>
                        <td><strong>${i.name.toUpperCase()}</strong><br><small style="opacity:0.5">${i.cat}</small></td>
                        <td><span class="badge ${bClass}">${i.qty} UNITS</span></td>
                        <td>${i.price.toLocaleString()}</td>
                        <td><i class="fas fa-trash" style="color:var(--danger); cursor:pointer;" onclick="deleteItem(${i.id})"></i></td>
                    </tr>`;
            });
        }

        function toast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setTextColor(30, 39, 46);
            doc.text(`Official Asset Ledger: ${account.fname}`, 14, 15);
            doc.autoTable({ 
                head: [['Asset', 'Qty', 'Unit Price']], 
                body: inventory.map(i => [i.name.toUpperCase(), i.qty, i.price]),
                headStyles: { fillColor: [30, 39, 46] }
            });
            doc.save('Executive_Audit.pdf');
        }

        function exportCSV() {
            let csv = "Asset,Qty,Price\n";
            inventory.forEach(i => csv += `${i.name},${i.qty},${i.price}\n`);
            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Ledger_Sync.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            toast("CSV Synced");
        }

        function sendWA() {
            let msg = `*OFFICIAL LEDGER SYNC*%0A*Admin:* ${account.fname}%0A%0A`;
            inventory.forEach(i => msg += `• ${i.name.toUpperCase()}: ${i.qty}%0A`);
            window.open(`https://wa.me/254700000000?text=${msg}`);
        }

        function resetApp() { if(confirm("Clear system database?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
                </html>
