<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockPro | Ultimate 2026</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg: #0f0c15; --card: #1a1625; --text: #f0ebff;
            --primary: #d4af37; --secondary: #38bdf8; --tertiary: #9d81ff; --danger: #ff4d4d; --accent: #2d2640;
        }
        body.light-mode {
            --bg: #fdfdfd; --card: #ffffff; --text: #1a1a1a; --accent: #f0f0f0;
        }
        .low-stock { border-left: 5px solid #ffa500 !important; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 rgba(255,165,0,0.4); } 70% { box-shadow: 0 0 0 10px rgba(255,165,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,165,0,0); } }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; overflow-x: hidden; }
        nav { background: var(--card); padding: 15px 20px; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent); }
       .tab-box { display: flex; gap: 15px; align-items: center; }
       .tab { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; opacity: 0.5; cursor: pointer; padding: 5px 0; }
       .tab.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }
       .container { max-width: 500px; margin: 15px auto; padding: 0 15px; display: none; }
       .page { display: none; animation: fadeIn 0.4s ease; }
       .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
       .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 10px; box-sizing: border-box; font-size: 16px; }
       .btn { padding: 16px; border: none; cursor: pointer; border-radius: 10px; font-weight: 800; width: 100%; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
       .btn-main { background: var(--primary); color: #000; }
       .btn-danger { background: var(--danger); color: white; border-radius: 8px; width: 42px; height: 42px; border: none; }
        #qr-view { width: 100%; min-height: 280px; display: none; border-radius: 12px; margin-bottom: 15px; border: 3px solid var(--primary); background: #000; overflow: hidden; }
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; padding: 14px 28px; border-radius: 50px; display: none; font-weight: 900; z-index: 10001; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.9rem; }
        #pay-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
       .pay-card { background: #1a1a1a; width: 100%; max-width: 350px; border-radius: 24px; padding: 30px; text-align: center; border: 1px solid #333; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="dark-mode">

    <div id="auth-overlay" style="position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:var(--card); padding:30px; border-radius:20px; width:85%; max-width:340px; text-align:center; border:1px solid var(--primary);">
            <h2 style="color:var(--primary); margin:0;">STOCKPRO</h2>
            <p style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 20px;">Secure Inventory Management</p>
            <input type="text" id="u" placeholder="Enter Your Name">
            <input type="password" id="p" placeholder="Set Password">
            <select id="r_select" style="margin-bottom: 15px;">
                <option value="" disabled selected>Select Role</option>
                <option value="Admin">Admin</option>
                <option value="Staff">Staff</option>
            </select>
            <button class="btn btn-main" onclick="doLogin()">Unlock System</button>
        </div>
    </div>

    <nav id="navbar">
        <div style="font-weight:900; color:var(--primary)">STOCKPRO</div>
        <div class="tab-box">
            <div class="tab active" onclick="tab('dash', event)">Home</div>
            <div class="tab" onclick="tab('inv', event)">Ledger</div>
            <div class="tab" onclick="tab('rep', event)">Docs</div>
            <i class="fas fa-moon" id="mode-icon" onclick="toggleMode()" style="cursor:pointer; color:var(--primary); font-size: 1.3rem;"></i>
        </div>
    </nav>

    <div class="container" id="app">
        <section id="p-dash" class="page active">
            <div id="chart-card" class="card" style="display:none; height: 260px; text-align:center;">
                <canvas id="stockPie"></canvas>
            </div>
            <div class="card">
                        <div id="reader" style="width: 100%; display: none; margin-bottom: 15px; border-radius: 8px; overflow: hidden;"></div>
        <button class="btn" style="width: 100%; margin-bottom: 15px; background:var(--accent); color:var(--text);" onclick="toggleScanner()">
            📷 <span id="scanBtnText">START SCANNER</span>
        </button>
                <input id="n" placeholder="Item Name">
                <input id="q" type="number" placeholder="Quantity">
                <div id="adm-pr" style="display:none;"><input id="pr" type="number" placeholder="Price (KES)"></div>
                <select id="cat">
                    <option>Hardware</option>
                    <option>Software</option>
                    <option>Materials</option>
                </select>
                <button class="btn btn-main" onclick="add()">Commit Asset</button>
            </div>
        </section>

        <section id="p-inv" class="page">
            <div class="card">
                <input placeholder="Search assets..." onkeyup="draw()" id="find">
                <div id="table-body" style="margin-top: 10px; width:100%;"></div>
            </div>
        </section>

        <section id="p-rep" class="page">
            <div class="card" onclick="pdf()" style="cursor:pointer; display:flex; justify-content:space-between; margin-bottom:12px;">
                <span>Audit Report (PDF)</span> <i class="fas fa-file-pdf" style="color:var(--danger)"></i>
            </div>
            <div id="adm-csv" class="card" onclick="csv()" style="display:none; cursor:pointer; justify-content:space-between; margin-bottom:12px;">
                <span>Full Ledger (CSV)</span> <i class="fas fa-file-csv" style="color:var(--secondary)"></i>
            </div>
            <button class="btn" style="background:#25D366; color:white;" onclick="wa()">
                <i class="fab fa-whatsapp"></i> Sync to WhatsApp
            </button>
        </section>
    </div>

    <div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBAVRljN13EB1J8w4jJ3Qjk8iqjgxSqfAI",
        authDomain: "stockpro-9be18.firebaseapp.com",
        databaseURL: "https://stockpro-9be18-default-rtdb.firebaseio.com",
        projectId: "stockpro-9be18",
        storageBucket: "stockpro-9be18.firebasestorage.app",
        messagingSenderId: "1025574986774",
        appId: "1:1025574986774:web:78fb24039432c921b84137",
        measurementId: "G-PWNYV0Y8G7"
    };

    const app = initializeApp(firebaseConfig);
    const fdb = getDatabase(app);
    window.fdb = fdb;
    const inventoryRef = ref(fdb);

    window.db = [];
    window.role = '';
    window.userName = '';
    window.chart = null;
    window.html5QrCode = null;

    window.doLogin = function() {
        let name = document.getElementById('u').value.trim();
        let pass = document.getElementById('p').value.trim();
        let r = document.getElementById('r_select').value;
        if (!name ||!pass ||!r) return alert("Fill all fields!");
        window.userName = name;
        window.role = r;
        document.getElementById('auth-overlay').style.display='none';
        document.getElementById('navbar').style.display='flex';
        document.getElementById('app').style.display='block';
        if(r === 'Admin') {
            document.getElementById('adm-pr').style.display = 'block';
            document.getElementById('adm-csv').style.display = 'flex';
            document.getElementById('chart-card').style.display = 'block';
            setTimeout(initChart, 500);
        }
        draw();
        window.toast(`✅ Welcome ${name}`);
    };

    window.tab = function(p, e) {
        document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        e.currentTarget.classList.add('active');
        draw();
    };

    window.toggleMode = function() { document.body.classList.toggle('light-mode'); };

    window.toast = function(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    };

    onValue(inventoryRef, (snapshot) => {
        const data = snapshot.val();
        window.db = [];
        if (data) {
            Object.keys(data).forEach(id => {
                window.db.push({...data[id], firebaseId: id });
            });
        }
        draw();
        if(window.chart) updateChart();
    });

    window.draw = function() {
    try {
        let invData = window.db || [];
        let find = document.getElementById('find').value.toLowerCase();

        let filteredData = invData.filter(i => {
            if (!i || !i.name) return false;
            return i.name.toLowerCase().includes(find);
        });

        const listEl = document.getElementById('table-body');
        listEl.innerHTML = '';

        filteredData.forEach(i => {
            let s = (i.status || "unverified").toString().toLowerCase().trim();
            let invBadge = "";
            let borderColor = "";

            let isUnverified = s === "unverified" || s === "unpaid";
            let isPending = s === "pending";
            let isSubmitted = s === "submitted";
            let isVerified = s === "verified" || s === "paid";
            
            if (isUnverified) {
                invBadge = '<span style="color: #ff4d4d; font-size: 11px;">🚫 Awaiting Payment</span>';
                borderColor = '#ff4d4d';
            } else if (isPending) {
                invBadge = '<span style="color: #ffa500; font-size: 11px;">⌛ Pending Processing</span>';
                borderColor = '#ffa500';
            } else if (isSubmitted) {
                invBadge = '<span style="color: #facc15; font-size: 11px;">💰 Code Submitted</span>';
                borderColor = '#facc15';
            } else if (isVerified) {
                invBadge = '<span style="color: #4CAF50; font-size: 11px;">✅ PAID - Stock Verified</span>';
                borderColor = '#4CAF50';
            }

            // LOW STOCK OVERRIDE - must be after verified check
            let isLowStock = i.qty <= 5 && isVerified; // 5 = reorder level
            if (isLowStock) {
                invBadge = '<span style="color: #ffa500; font-size: 11px;">⚠️ LOW STOCK: ' + i.qty + ' left</span>';
                borderColor = '#ffa500';
            }

            // FIXED: Now shows mpesaCode correctly
            let mpesaLine = i.mpesaCode ? `<div style="color: #0ea5e9; font-size: 10px; font-weight: 700; margin-top: 4px;">M-Pesa: ${i.mpesaCode}</div>` : "";
            
            let safeId = (i.firebaseId || '').replace(/'/g, "\\'");
            let safeName = (i.name || '').replace(/'/g, "\\'");
            let safePrice = i.price || 0;
            let safeQty = i.qty || 0;

            let buttons = '';

            // Anyone can pay
            if (s === "unpaid" || s === "unverified") {
                buttons += `<button class="btn" style="background:#2ecc71; color:white; margin-right:5px;" onclick="window.initPay('${safeId}', '${safePrice}', '${safeName}')">Pay</button>`;
            }
        
            // ONLY Admin sees Verify button. NO delete button for anyone.
            if (window.role === 'Admin' && s === "submitted") {
                buttons += `<button class="btn" style="background:#3498db; color:white;" onclick="window.verifyStock('${safeId}')">Verify</button>`;
            }

            // Alert Owner button for low stock
            if (window.role === 'Admin' && isLowStock) {
                buttons += `<button class="btn" style="background:#ffa500; color:#000; margin-right:5px;" onclick="window.alertOwner('${safeName}', ${safeQty})">Alert Owner</button>`;
            }

            listEl.innerHTML += `
            <div class="card ${isLowStock ? 'low-stock' : ''}" style="border-left: 5px solid ${borderColor}; position: relative; margin-bottom: 12px; padding: 15px; background: var(--card); border-radius: 8px;">
                <div style="position: absolute; top: 10px; right: 12px;">${invBadge}</div>
                <div style="font-size: 15px; font-weight: 800; color: var(--text);">
                    ${safeName}
                    ${mpesaLine}
                </div>
                <div style="font-size: 13px; color: var(--text); opacity: 0.7; margin-top: 8px;">
                    <span>${i.qty} PCS × KES ${safePrice}</span><br>
                    <span style="font-weight: 800; color: #22c55e;">Total: KES ${i.qty * safePrice}</span>
                </div>
                <div style="margin-top: 10px;">
                    ${buttons}
                </div>
            </div>`;

        });

    } catch(e) {
        document.getElementById('table-body').innerHTML = `<div style="color:red; padding:20px;">DRAW ERROR: ${e.message}</div>`;
    }
};

    


    window.add = async function() {
        let n = document.getElementById('n').value.trim();
        let q = parseInt(document.getElementById('q').value);
        let p = document.getElementById('pr').value || 0;

        if(!n || isNaN(q) || q <= 0) return alert("Check name and quantity!");

        await push(inventoryRef, {
            name: n,
            qty: q,
            price: p,
            cat: document.getElementById('cat').value,
            status: "Unpaid",
            addedBy: window.userName,
            addedAt: new Date().toISOString()
        });

        window.toast("📦 Item added to list. Tap 'Pay' to submit code.");
        document.getElementById('n').value = '';
        document.getElementById('q').value = '';
        document.getElementById('pr').value = '';
    };

    window.initPay = function(id, price, name) {
        const modal = document.createElement('div');
        modal.id = 'pay-modal-overlay';
        modal.innerHTML = `
            <div class="pay-card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/M-PESA_LOGO-01.svg" style="width:100px;margin-bottom:15px;">
                <h3 style="margin:0;color:#25D366;">Complete Payment</h3>
                <p style="font-size:14px;">Pay <b>KES ${price}</b> for ${name}</p>

                <div class="till-box">
                    <span style="font-size:10px; opacity:0.7;">LIPA NA MPESA</span><br>
                    <b style="font-size:20px; color:#25D366;">TILL: 5637180</b>
                </div>

                <input type="text" id="mpesa-code-input" placeholder="ENTER M-PESA CODE"
                    style="width:100%; padding:12px; margin-bottom:15px; border:1px solid var(--accent); background:var(--bg); color:var(--text); border-radius:8px; text-align:center; font-weight:bold; text-transform:uppercase;">

                <button class="btn-confirm" onclick="window.confirmPaid('${id}')">SUBMIT CODE</button>
                <button onclick="document.getElementById('pay-modal-overlay').remove()"
                    style="background:none; border:none; color:var(--text); opacity:0.6; margin-top:15px; cursor:pointer; font-size:13px;">CANCEL</button>
            </div>`;
        document.body.appendChild(modal);
    };

    window.confirmPaid = function(id) {
        const codeInput = document.getElementById('mpesa-code-input');
        if (!codeInput) return alert("ERROR: Can't find M-Pesa input box");

        const code = codeInput.value.trim().toUpperCase();
        if (code.length < 5) return alert("Please enter a valid M-Pesa code");

        update(ref(fdb, id), {
            status: "Submitted",
            mpesaCode: code,
            submittedAt: new Date().toISOString()
        }).then(() => {
            window.toast("✅ Code submitted! Admin will verify.");
            const modal = document.getElementById('pay-modal-overlay');
            if (modal) modal.remove();
        }).catch(e => alert("Firebase Error: " + e.message));
    };

    window.verifyStock = (id) => update(ref(fdb, id), { status: "Verified" });
    window.del = (id) => {
    window.toast("🔐 deletion denied by cloud");
};


    window.approveItem = (id) => {
        if (window.role!== 'Admin') return alert("❌ Only Admin can approve stock.");
        update(ref(fdb, id), {
            status: "Pending",
            approvedBy: window.userName,
            approvedAt: new Date().toISOString()
        }).then(() => window.toast("✅ Stock approved. Ready for payment."));
    };

    window.initChart = function() {
        const ctx = document.getElementById('stockPie');
        if (!ctx) return;
        window.chart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: [], datasets: [{ data: [], backgroundColor: ['#d4af37','#38bdf8','#9d81ff'] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
        updateChart();
    };

    window.updateChart = function() {
        if (!window.chart) return;
        let cats = {};
        window.db.forEach(i => { cats[i.cat] = (cats[i.cat] || 0) + (i.qty || 0); });
        window.chart.data.labels = Object.keys(cats);
        window.chart.data.datasets[0].data = Object.values(cats);
        window.chart.update();
    };
    let html5QrCode;
let isScanning = false;

window.toggleScanner = async function() {
    const readerEl = document.getElementById('reader');
    const btnText = document.getElementById('scanBtnText');
    
    if (!isScanning) {
        readerEl.style.display = 'block';
        btnText.innerText = 'STOP SCANNER';
        isScanning = true;
        
        html5QrCode = new Html5Qrcode("reader");
        
        try {
            await html5QrCode.start(
                { facingMode: "environment" }, // Use back camera
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText, decodedResult) => {
                    // Success! We got a code
                    document.getElementById('n').value = decodedText;
                    
                    window.toast(`Scanned: ${decodedText}`);
                    stopScan();
                },
                (errorMessage) => {
                    // Ignore scan errors, it scans continuously
                }
            );
        } catch (err) {
            window.toast("Camera failed: " + err);
            stopScan();
        }
        
    } else {
        stopScan();
    }
};

function stopScan() {
    const readerEl = document.getElementById('reader');
    const btnText = document.getElementById('scanBtnText');
    
    if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
            readerEl.style.display = 'none';
            btnText.innerText = 'START SCANNER';
            isScanning = false;
        }).catch(() => {
            readerEl.style.display = 'none';
            btnText.innerText = 'START SCANNER';
            isScanning = false;
        });
    }
            }
    
window.csv = function() {
    if (window.role !== 'Admin') return window.toast("❌ Admin only");
    
    let data = window.db || [];
    if (data.length === 0) return window.toast("No data to export");
    
    // CSV Headers
    let headers = ["Name", "Quantity", "Price", "Total", "Category", "Status", "M-Pesa Code", "Added By", "Added At", "Submitted At"];
    let rows = data.map(i => [
        i.name || "",
        i.qty || 0,
        i.price || 0,
        (i.qty || 0) * (i.price || 0),
        i.cat || "",
        i.status || "",
        i.mpesaCode || "",
        i.addedBy || "",
        i.addedAt ? new Date(i.addedAt).toLocaleString() : "",
        i.submittedAt ? new Date(i.submittedAt).toLocaleString() : ""
    ]);
    
    // Build CSV string
    let csvContent = [headers, ...rows]
        .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(","))
        .join("\n");
    
    // Download it
    let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement("a");
    let url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", `StockPro_Ledger_${new Date().toISOString().split('T')[0]}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    window.toast("📊 CSV Downloaded");
};
    window.pdf = function() {
    let data = window.db || [];
    if (data.length === 0) return window.toast("No data for PDF");

    // Use jspdf from window
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // Header
    doc.setFontSize(18);
    doc.setTextColor(212, 175, 55); // Gold
    doc.text("STOCKPRO AUDIT REPORT", 14, 20);

    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 28);
    doc.text(`Generated by: ${window.userName} (${window.role})`, 14, 34);

    // Filter data based on role
    let reportData = window.role === 'Admin'? data : data.filter(i => i.status === 'Verified');

    // Stats
    let totalItems = reportData.reduce((sum, i) => sum + (i.qty || 0), 0);
    let totalValue = reportData.reduce((sum, i) => sum + ((i.qty || 0) * (i.price || 0)), 0);
    let verifiedCount = reportData.filter(i => i.status === 'Verified' || i.status === 'Paid').length;

    doc.setFontSize(11);
    doc.setTextColor(0);
    doc.text(`Total Items: ${totalItems} PCS`, 14, 44);
    doc.text(`Total Value: KES ${totalValue.toLocaleString()}`, 14, 50);
    doc.text(`Verified Assets: ${verifiedCount}`, 14, 56);

    // Table data
    const tableColumn = ["Item", "Qty", "Price", "Total", "Status", "M-Pesa"];
    const tableRows = [];

    reportData.forEach(i => {
        const itemData = [
            i.name || "",
            i.qty || 0,
            `KES ${i.price || 0}`,
            `KES ${(i.qty || 0) * (i.price || 0)}`,
            i.status || "",
            i.mpesaCode || "-"
        ];
        tableRows.push(itemData);
    });

    // Create table
    doc.autoTable({
        head: [tableColumn],
        body: tableRows,
        startY: 65,
        theme: 'grid',
        headStyles: { fillColor: [212, 175, 55], textColor: 0, fontStyle: 'bold' },
        styles: { fontSize: 8, cellPadding: 2 },
        columnStyles: {
            0: { cellWidth: 40 }, // Item name wider
            5: { cellWidth: 25 } // M-Pesa code
        }
    });

    // Footer
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFontSize(8);
        doc.setTextColor(150);
        doc.text(`StockPro Ultimate 2026 - Page ${i} of ${pageCount}`, 14, doc.internal.pageSize.height - 10);
    }

    // Download
    doc.save(`StockPro_Audit_${new Date().toISOString().split('T')[0]}.pdf`);
    window.toast("📄 PDF Generated");
};
 window.wa = function() {
    console.log("WA DEBUG - Full DB:", window.db); // Check browser console
    
    let data = window.db || [];
    
    if (data.length === 0) {
        alert("DEBUG: Database is empty. window.db length = 0. Check if items show in Ledger tab first.");
        return window.toast("No items found in database");
    }
    
    // If we get here, we have data
    let totalValue = data.reduce((sum, i) => sum + ((i.qty || 0) * (i.price || 0)), 0);
    let totalQty = data.reduce((sum, i) => sum + (i.qty || 0), 0);
    
    let message = `*STOCKPRO LEDGER* 📦\n`;
    message += `_Generated: ${new Date().toLocaleString()}_\n\n`;
    message += `*Items:* ${data.length} | *Qty:* ${totalQty} | *Value:* KES ${totalValue.toLocaleString()}\n\n`;
    
    data.forEach((i, index) => {
        let s = (i.status || "unverified").toLowerCase();
        let emoji = s.includes("paid") || s.includes("verified") ? "✅" : s.includes("submit") ? "💰" : "🚫";
        
        message += `${index + 1}. *${i.name}* ${emoji}\n`;
        message += `   ${i.qty} × KES ${i.price || 0} = *KES ${(i.qty || 0) * (i.price || 0)}*\n`;
        message += `   Status: ${i.status}\n`;
        if (i.mpesaCode) message += `   M-Pesa: ${i.mpesaCode}\n`;
        message += `   By: ${i.addedBy}\n\n`;
    });
    
    let encodedMsg = encodeURIComponent(message);
    let yourNumber = "254112873218"; 
    let waUrl = `https://wa.me/${yourNumber}?text=${encodedMsg}`;
    window.open(waUrl, '_blank');
    
    window.toast(`📲 Sent ${data.length} items to WhatsApp`);
};window.alertOwner = function(name, qty) {
    let msg = `STOCKPRO ALERT ⚠️%0A${name} is LOW%0AOnly ${qty} units remaining%0AReorder now to avoid stock-out`;
    window.open(`https://wa.me/?text=${msg}`, '_blank');
    window.toast("WhatsApp alert ready to send");
};
                                            
</script>
</body>
