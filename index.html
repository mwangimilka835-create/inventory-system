<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS | Professional Portfolio Project</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --accent: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        .dark-mode {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --primary: #3b82f6;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            transition: 0.3s;
        }

        /* NAVIGATION */
        nav {
            background: #1e293b;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
        }

        nav a.active { background: var(--primary); color: white; }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        /* DASHBOARD */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-card h3 { margin: 0; font-size: 0.8rem; color: var(--secondary); text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 1.4rem; font-weight: 700; color: var(--primary); }

        /* TABLE STYLING */
        .table-container {
            background: var(--card);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        thead th { background: #1e293b; color: var(--accent); padding: 15px; text-align: left; font-size: 0.75rem; text-transform: uppercase; }
        tbody td { padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 14px; }

        .low-stock { background: rgba(239, 68, 68, 0.05); }

        /* ACTION BUTTONS */
        .btn-order {
            background: #25D366;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }

        .btn-del {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* FORM */
        .form-card { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input, select { width: 100%; padding: 12px; margin: 10px 0 20px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }

        #toast {
            visibility: hidden;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 20px; opacity: 1;} }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<nav class="no-print">
    <a id="nav-dashboard" onclick="showSection('dashboard')" class="active">📊 DASHBOARD</a>
    <a id="nav-inventory" onclick="showSection('inventory')">📦 INVENTORY</a>
    <a id="nav-add" onclick="showSection('add')">➕ ADD ITEM</a>
</nav>

<div class="container">
    <header>
        <h1 style="font-size: 1.5rem; margin:0;">Inventory System</h1>
        <button onclick="toggleDarkMode()" id="theme-btn" style="background:none; border:none; font-size:20px; cursor:pointer;">🌙</button>
    </header>

    <div id="dashboard-section">
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Items</h3><p id="stat-count">0</p></div>
            <div class="stat-card"><h3>Inventory Value</h3><p id="stat-value">KES 0</p></div>
            <div class="stat-card"><h3>Low Stock</h3><p id="stat-low" style="color:var(--danger)">0</p></div>
        </div>
        <div style="text-align:center; padding: 2rem; color: gray; background: var(--card); border-radius: 12px;">
            <p>Portfolio Showcase: A fully functional CRUD Inventory System.</p>
        </div>
    </div>

    <div id="add-section" style="display:none;">
        <div class="form-card">
            <h2>Add New Stock Item</h2>
            <input type="text" id="pName" placeholder="Product Name">
            <select id="pCategory">
                <option value="Electronics">Electronics</option>
                <option value="Hardware">Hardware</option>
                <option value="Supplies">General Supplies</option>
            </select>
            <input type="number" id="pQty" placeholder="Quantity">
            <input type="number" id="pPrice" placeholder="Unit Price (KES)">
            <button class="btn-save" onclick="saveProduct()">✅ Save to System</button>
        </div>
    </div>

    <div id="inventory-section" style="display:none;">
        <div class="no-print" style="margin-bottom: 1rem; display: flex; gap: 10px;">
            <button onclick="window.print()" style="padding: 10px; border-radius: 6px; background: #64748b; color: white; border:none;">🖨️ PDF Report</button>
            <button onclick="exportCSV()" style="padding: 10px; border-radius: 6px; background: #2563eb; color: white; border:none;">📊 Export Data</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th class="no-print">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast">Saved! ✅</div>

<script>
    // STARTUP
    window.onload = () => {
        if(localStorage.getItem("ims-theme") === "dark") toggleDarkMode();
        showSection('dashboard');
    };

    // NAVIGATION
    function showSection(id) {
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById('nav-' + id).classList.add('active');
        document.getElementById('dashboard-section').style.display = 'none';
        document.getElementById('add-section').style.display = 'none';
        document.getElementById('inventory-section').style.display = 'none';
        document.getElementById(id + '-section').style.display = 'block';
        updateStats();
        renderTable();
    }

    // CRUD: SAVE
    function saveProduct() {
        const name = document.getElementById("pName").value;
        const cat = document.getElementById("pCategory").value;
        const qty = parseInt(document.getElementById("pQty").value);
        const price = parseFloat(document.getElementById("pPrice").value);
        if (!name || isNaN(qty) || isNaN(price)) return alert("Please fill all fields!");

        let db = JSON.parse(localStorage.getItem("ims_db")) || [];
        db.push({ name, cat, qty, price, date: new Date().toLocaleDateString() });
        localStorage.setItem("ims_db", JSON.stringify(db));

        document.getElementById("pName").value = "";
        document.getElementById("pQty").value = "";
        document.getElementById("pPrice").value = "";
        
        showToast("Success! Item added.");
        showSection('inventory');
    }

    // CRUD: READ (RENDER)
    function renderTable() {
        const db = JSON.parse(localStorage.getItem("ims_db")) || [];
        const tbody = document.getElementById("inventory-body");
        tbody.innerHTML = "";

        db.forEach((item, index) => {
            const isLow = item.qty < 5;
            const row = tbody.insertRow();
            if(isLow) row.className = "low-stock";

            // WHATSAPP LINK
            const whatsappMsg = window.encodeURIComponent(`Order Request: ${item.name} (Current Qty: ${item.qty})`);

            row.innerHTML = `
                <td>${item.date}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.qty} ${isLow ? '⚠️' : ''}</td>
                <td>KES ${item.price.toLocaleString()}</td>
                <td class="no-print" style="display:flex; gap:10px;">
                    <a href="https://wa.me/254112873218?text=${whatsappMsg}" target="_blank" class="btn-order">Order</a>
                    <button onclick="deleteItem(${index})" class="btn-del">Del</button>
                </td>
            `;
        });
    }

    // UPDATE DASHBOARD
    function updateStats() {
        const db = JSON.parse(localStorage.getItem("ims_db")) || [];
        let totalVal = 0; let low = 0;
        db.forEach(i => { totalVal += (i.qty * i.price); if(i.qty < 5) low++; });
        document.getElementById("stat-count").innerText = db.length;
        document.getElementById("stat-value").innerText = "KES " + totalVal.toLocaleString();
        document.getElementById("stat-low").innerText = low;
    }

    function deleteItem(index) {
        if(confirm("Remove this product?")) {
            let db = JSON.parse(localStorage.getItem("ims_db")) || [];
            db.splice(index, 1);
            localStorage.setItem("ims_db", JSON.stringify(db));
            renderTable(); updateStats();
        }
    }

    function toggleDarkMode() {
        const isDark = document.body.classList.toggle("dark-mode");
        document.getElementById("theme-btn").innerText = isDark ? "☀️" : "🌙";
        localStorage.setItem("ims-theme", isDark ? "dark" : "light");
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    function exportCSV() {
        const db = JSON.parse(localStorage.getItem("ims_db")) || [];
        let csv = "Date,Product,Qty,Price\n";
        db.forEach(i => csv += `${i.date},${i.name},${i.qty},${i.price}\n`);
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = 'inventory_export.csv';
        a.click();
    }
</script>
</body>
                </html>
