<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro Cloud | Full System</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <script>
      // CONFIGURATION: Replace with your actual Supabase details
      const SUPABASE_URL = 'YOUR_SUPABASE_URL';
      const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #1c1e21; --primary: #2ecc71; --accent: #3498db; --danger: #e74c3c; }
        body.dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        
        /* Login UI */
        #login-overlay { position: fixed; inset: 0; background: #2ecc71; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; width: 320px; }
        
        /* Dashboard UI */
        #dashboard { display: none; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--primary); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #44444422; }
        .low-stock { color: var(--danger); font-weight: bold; background: rgba(231, 76, 60, 0.1); }
        
        input, select, button { padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; }
        .btn-main { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-action { width: auto; padding: 6px 12px; cursor: pointer; margin-right: 4px; border: none; border-radius: 4px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body class="light-mode" id="body-tag">

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color:#333">StockPro Secure Login</h2>
            <input type="password" id="login-pass" placeholder="Enter Admin Password">
            <button class="btn-main" onclick="attemptLogin()">Enter Dashboard</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="container">
            <div class="header">
                <h1>StockPro Cloud</h1>
                <div>
                    <button class="btn-action" onclick="toggleTheme()">🌙 Theme</button>
                    <button class="btn-action" onclick="location.reload()" style="background:#666; color:white">Logout</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><h3>Total Stock</h3><p id="stat-total">0</p></div>
                <div class="stat-card" style="background:var(--accent)"><h3>Valuation</h3><p id="stat-value">KES 0</p></div>
            </div>

            <div class="card">
                <h3>Manage Inventory</h3>
                <form id="productForm">
                    <input type="hidden" id="edit-id">
                    <input type="text" id="p-name" placeholder="Product Name" required>
                    <div style="display:flex; gap:10px;">
                        <input type="number" id="p-qty" placeholder="Quantity" required>
                        <input type="number" id="p-price" placeholder="Price (KES)" required>
                    </div>
                    <button type="submit" class="btn-main" id="save-btn">Save to Cloud Database</button>
                </form>
            </div>

            <div class="card">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="search" placeholder="Search by name..." onkeyup="searchTable()" style="flex:2">
                    <button onclick="exportCSV()" class="btn-action" style="background:#3498db; color:white">CSV</button>
                    <button onclick="exportPDF()" class="btn-action" style="background:#8e44ad; color:white">PDF</button>
                </div>
                <table>
                    <thead>
                        <tr><th>Product</th><th>Qty</th><th>Price</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="inventoryBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let stockData = [];

        // 1. LOGIN LOGIC
        function attemptLogin() {
            const pass = document.getElementById('login-pass').value;
            if(pass === "admin123") { // Your secure password
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                fetchFromCloud();
            } else { alert("Access Denied."); }
        }

        // 2. CLOUD DATA OPERATIONS
        async function fetchFromCloud() {
            const { data, error } = await supabase.from('inventory').select('*').order('created_at', {ascending: false});
            if(!error) { stockData = data || []; renderUI(); }
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const payload = {
                name: document.getElementById('p-name').value,
                quantity: parseInt(document.getElementById('p-qty').value),
                price: parseFloat(document.getElementById('p-price').value)
            };

            if(id) { 
                await supabase.from('inventory').update(payload).eq('id', id); 
                document.getElementById('save-btn').innerText = "Save to Cloud Database";
                document.getElementById('edit-id').value = "";
            } else { 
                await supabase.from('inventory').insert([payload]); 
            }
            document.getElementById('productForm').reset();
            fetchFromCloud();
        };

        async function remove(id) {
            if(confirm("Delete from cloud?")) {
                await supabase.from('inventory').delete().eq('id', id);
                fetchFromCloud();
            }
        }

        function triggerEdit(id) {
            const item = stockData.find(i => i.id === id);
            document.getElementById('p-name').value = item.name;
            document.getElementById('p-qty').value = item.quantity;
            document.getElementById('p-price').value = item.price;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('save-btn').innerText = "Update Product Info";
            window.scrollTo(0,0);
        }

        // 3. UI & REPORTING
        function renderUI() {
            const body = document.getElementById('inventoryBody');
            body.innerHTML = '';
            let totalQ = 0, totalV = 0;

            stockData.forEach(item => {
                const isLow = item.quantity <= 5;
                totalQ += item.quantity;
                totalV += (item.quantity * item.price);
                body.innerHTML += `
                    <tr class="${isLow ? 'low-stock' : ''}">
                        <td>${item.name} ${isLow ? '⚠️' : ''}</td>
                        <td>${item.quantity}</td>
                        <td>KES ${item.price.toLocaleString()}</td>
                        <td>
                            <button class="btn-action" onclick="triggerEdit('${item.id}')" style="background:#f39c12; color:white">Edit</button>
                            <button class="btn-action" onclick="remove('${item.id}')" style="background:#e74c3c; color:white">Del</button>
                        </td>
                    </tr>`;
            });
            document.getElementById('stat-total').innerText = totalQ;
            document.getElementById('stat-value').innerText = `KES ${totalV.toLocaleString()}`;
        }

        function searchTable() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = stockData.filter(i => i.name.toLowerCase().includes(query));
            stockData = filtered; renderUI(); fetchFromCloud(); // Resets on empty
        }

        function exportCSV() {
            let csv = "Product,Quantity,Price\n";
            stockData.forEach(i => csv += `${i.name},${i.quantity},${i.price}\n`);
            const blob = new Blob([csv], {type:'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href=url; a.download='Stock_Report.csv'; a.click();
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("StockPro Inventory Report", 14, 15);
            doc.autoTable({ head: [['Product', 'Qty', 'Price']], body: stockData.map(i => [i.name, i.quantity, i.price]) });
            doc.save("Inventory_Report.pdf");
        }

        function toggleTheme() { document.getElementById('body-tag').classList.toggle('dark-mode'); }
    </script>
</body>
                        </html>
