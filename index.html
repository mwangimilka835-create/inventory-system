<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockPro | Ultimate 2026</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { 
            --bg: #0f0c15; --card: #1a1625; --text: #f0ebff; 
            --primary: #d4af37; --secondary: #38bdf8; --tertiary: #9d81ff; --danger: #ff4d4d; --accent: #2d2640;
        }
        body.light-mode { 
            --bg: #fdfdfd; --card: #ffffff; --text: #1a1a1a; --accent: #f0f0f0;
        }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; overflow-x: hidden; }
        
        /* Navigation */
        nav { background: var(--card); padding: 15px 20px; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent); }
        .tab-box { display: flex; gap: 15px; align-items: center; }
        .tab { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; opacity: 0.5; cursor: pointer; padding: 5px 0; }
        .tab.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }

        .container { max-width: 500px; margin: 15px auto; padding: 0 15px; display: none; }
        .page { display: none; animation: fadeIn 0.4s ease; } 
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Cards */
        .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        
        .btn { padding: 16px; border: none; cursor: pointer; border-radius: 10px; font-weight: 800; width: 100%; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-main { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: white; border-radius: 8px; width: 42px; height: 42px; border: none; }

        /* Scanner */
        #qr-view { width: 100%; min-height: 280px; display: none; border-radius: 12px; margin-bottom: 15px; border: 3px solid var(--primary); background: #000; overflow: hidden; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px 10px; color: var(--primary); border-bottom: 2px solid var(--accent); font-size: 0.75rem; }
        td { padding: 15px 10px; border-bottom: 1px solid var(--accent); font-size: 0.95rem; }
        
        /* POP-UP TOAST */
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; padding: 14px 28px; border-radius: 50px; display: none; font-weight: 900; z-index: 10001; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.9rem; }
    </style>
</head>
<body class="dark-mode">

    <div id="auth-overlay" style="position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:var(--card); padding:30px; border-radius:20px; width:85%; max-width:340px; text-align:center; border:1px solid var(--primary);">
            <h2 style="color:var(--primary); margin:0;">STOCKPRO</h2>
            <p style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 20px;">Secure Inventory Management</p>
            <input type="text" id="u" placeholder="e.g. admin milka">
            <input type="password" id="p" placeholder="Password">
            <button class="btn btn-main" onclick="doLogin()">Unlock System</button>
        </div>
    </div>

    <nav id="navbar">
        <div style="font-weight:900; color:var(--primary)">STOCKPRO</div>
        <div class="tab-box">
            <div class="tab active" onclick="tab('dash', event)">Home</div>
            <div class="tab" onclick="tab('inv', event)">Ledger</div>
            <div class="tab" onclick="tab('rep', event)">Docs</div>
            <i class="fas fa-moon" id="mode-icon" onclick="toggleMode()" style="cursor:pointer; color:var(--primary); font-size: 1.3rem;"></i>
        </div>
    </nav>

    <div class="container" id="app">
        <section id="p-dash" class="page active">
            <div id="chart-card" class="card" style="display:none; height: 260px; text-align:center;">
                <canvas id="stockPie"></canvas>
            </div>
            <div class="card">
                <div id="qr-view"></div>
                <button id="scan-btn" class="btn" style="background:var(--accent); color:var(--text); margin-bottom:12px;" onclick="toggleScanner()">
                    <i class="fas fa-camera"></i> <span id="scan-text">Start Scanner</span>
                </button>
                <input id="n" placeholder="Item Name">
                <input id="q" type="number" placeholder="Quantity">
                <div id="adm-pr" style="display:none;"><input id="pr" type="number" placeholder="Price (KES)"></div>
                <select id="cat">
                    <option>Hardware</option>
                    <option>Software</option>
                    <option>Materials</option>
                </select>
                <button class="btn btn-main" onclick="add()">Commit Asset</button>
            </div>
        </section>

        <section id="p-inv" class="page">
            <div class="card">
                <input placeholder="Search assets..." onkeyup="draw()" id="find">
                <table>
                    <thead><tr><th>Asset</th><th>Qty</th><th>Action</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>

        <section id="p-rep" class="page">
            <div class="card" onclick="pdf()" style="cursor:pointer; display:flex; justify-content:space-between;">
                <span>Audit (PDF)</span> <i class="fas fa-file-pdf" style="color:var(--danger)"></i>
            </div>
            <div id="adm-csv" class="card" onclick="csv()" style="display:none; cursor:pointer; justify-content:space-between;">
                <span>Full Ledger (CSV)</span> <i class="fas fa-file-csv" style="color:var(--secondary)"></i>
            </div>
            <button class="btn" style="background:#25D366; color:white; margin-top:10px;" onclick="wa()">
                <i class="fab fa-whatsapp"></i> Sync to +254112873218
            </button>
        </section>
    </div>

    <div id="toast"></div>

    <script>
        let db = JSON.parse(localStorage.getItem('stock_final_v10')) || [];
        let role = ''; let userName = ''; let chart = null; let html5QrCode = null;

        // --- LOGIN & AUTH ---
        function doLogin() {
            let u = document.getElementById('u').value.trim().toLowerCase();
            let p = document.getElementById('p').value.trim();
            if (u.startsWith('admin ')) { userName = u.replace('admin ', ''); launch('Admin'); }
            else if (u.startsWith('staff ')) { userName = u.replace('staff ', ''); launch('Staff'); }
            else { alert("Login format: 'admin [name]' or 'staff [name]'"); }
        }

        function launch(r) {
            role = r;
            document.getElementById('auth-overlay').style.display='none';
            document.getElementById('navbar').style.display='flex';
            document.getElementById('app').style.display='block';
            if(r === 'Admin') {
                document.getElementById('adm-pr').style.display = 'block';
                document.getElementById('adm-csv').style.display = 'flex';
                document.getElementById('chart-card').style.display = 'block';
                setTimeout(initChart, 200);
            }
            draw(); toast(`✅ Access Granted: ${userName.toUpperCase()}`);
        }

        // --- THEME ---
        function toggleMode() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('mode-icon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
            if(chart) {
                chart.options.plugins.legend.labels.color = isLight ? '#1a1a1a' : '#f0ebff';
                chart.update();
            }
            toast(isLight ? "☀️ Light Mode" : "🌙 Dark Mode");
        }

        // --- PIE CHART ---
        function initChart() {
            const ctx = document.getElementById('stockPie').getContext('2d');
            chart = new Chart(ctx, {
                type: 'pie',
                data: { 
                    labels: ['H/W', 'S/W', 'MAT'], 
                    datasets: [{ data: [0,0,0], backgroundColor: ['#d4af37', '#38bdf8', '#9d81ff'], borderWidth: 0 }] 
                },
                options: { responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: { position: 'bottom', labels: { color: '#f0ebff', font: { weight: 'bold' } } } } 
                }
            });
            updateChart();
        }

        function updateChart() { if(chart) { chart.data.datasets[0].data = ['Hardware','Software','Materials'].map(c => db.filter(i=>i.cat===c).length); chart.update(); } }

        // --- OPERATIONS & CONFIRMATIONS ---
        function add() {
            let n = document.getElementById('n').value.trim(), q = parseInt(document.getElementById('q').value);
            if(!n || isNaN(q)) return alert("Check inputs!");
            if(confirm(`Commit ${n} to stock?`)) {
                db.push({ id: Date.now(), name: n, qty: q, price: document.getElementById('pr').value || 0, cat: document.getElementById('cat').value, addedBy: userName });
                localStorage.setItem('stock_final_v10', JSON.stringify(db));
                draw(); toast("📦 Asset Committed Successfully");
                document.getElementById('n').value = ''; document.getElementById('q').value = '';
            }
        }

        function del(id) {
            if(confirm("Permanently delete this entry?")) {
                db = db.filter(i => i.id !== id);
                localStorage.setItem('stock_final_v10', JSON.stringify(db));
                draw(); toast("🗑️ Entry Removed");
            }
        }

        function draw() {
            let b = document.getElementById('table-body'), s = document.getElementById('find').value.toLowerCase();
            b.innerHTML = '';
            db.filter(i => i.name.toLowerCase().includes(s)).forEach(i => {
                b.innerHTML += `<tr><td><strong>${i.name}</strong><br><small style="opacity:0.5">${i.cat}</small></td><td>${i.qty}</td><td><button class="btn-danger" onclick="del(${i.id})"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            updateChart();
        }

        // --- SCANNER KILL-SWITCH ---
        async function toggleScanner() {
            const qrBox = document.getElementById('qr-view');
            const btnText = document.getElementById('scan-text');
            if (!html5QrCode) {
                qrBox.style.display = 'block';
                html5QrCode = new Html5Qrcode("qr-view");
                btnText.innerText = "Kill Scanner";
                toast("📷 Opening Camera...");
                try {
                    await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 240 }, (t) => { 
                        document.getElementById('n').value = t; toast("🔍 Scanned: " + t); stopScanner(); 
                    });
                } catch (err) { alert("Enable Camera Permissions!"); stopScanner(); }
            } else { stopScanner(); }
        }

        async function stopScanner() {
            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch (e) {} 
                finally {
                    html5QrCode = null;
                    document.getElementById('qr-view').innerHTML = ''; 
                    document.getElementById('qr-view').style.display = 'none';
                    document.getElementById('scan-text').innerText = "Start Scanner";
                    toast("🔒 Camera Stopped");
                }
            }
        }

        // --- EXPORTS & SYNC ---
        function csv() {
            let c = "Item,Qty,Price,Category,User\n";
            db.forEach(i => c += `"${i.name}",${i.qty},${i.price},"${i.cat}","${i.addedBy}"\n`);
            const blob = new Blob([c], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Inventory.csv";
            link.click();
            toast("📄 CSV Downloaded");
        }

        function pdf() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.text("StockPro Audit", 14, 15);
            doc.autoTable({ head: [['Item', 'Qty', 'Category', 'User']], body: db.map(i => [i.name, i.qty, i.cat, i.addedBy]) });
            doc.save('Audit.pdf');
            toast("📕 PDF Downloaded");
        }

        function tab(p, e) {
            document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
            document.getElementById('p-'+p).classList.add('active');
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            e.currentTarget.classList.add('active');
        }

        function toast(m) { 
            let t=document.getElementById('toast'); 
            t.innerText=m; t.style.display='block'; 
            setTimeout(()=>t.style.display='none', 3000); 
        }
        
        function wa() { 
            let m = '*STOCKPRO UPDATE*%0A'; 
            db.forEach(i => m += `• ${i.name}: ${i.qty}%0A`); 
            window.open('https://wa.me/254112873218?text=' + m); 
        }
    </script>

       ← Back to Milka's Portfolio

</div>
</body>
