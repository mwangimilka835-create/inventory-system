<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #1e272e; --s: #d4af37; --bg: #f4f7f6; --c: #ffffff; --t: #2c3e50; --a: #dcdde1; --d: #c23616; }
        [data-theme="dark"] { --bg: #13171a; --c: #1e272e; --t: #f5f6fa; --a: #353b48; }
        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--t); margin: 0; transition: 0.3s; }
        nav { background: var(--p); padding: 15px 5%; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--s); }
        .nav-item { cursor: pointer; color: #fff; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }
        #auth-overlay { position: fixed; inset: 0; background: var(--p); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { background: var(--c); padding: 30px; border-radius: 4px; width: 90%; max-width: 350px; text-align: center; border-top: 5px solid var(--s); }
        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 15px; display: none; }
        .page { display: none; } .page.active { display: block; }
        .card { background: var(--c); padding: 20px; border-radius: 4px; border-left: 4px solid var(--s); margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .admin-only, .staff-only { display: none; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--a); background: var(--bg); color: var(--t); border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 15px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 800; width: 100%; margin-top: 10px; }
        .btn-main { background: var(--s); color: var(--p); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; color: var(--s); border-bottom: 2px solid var(--s); font-size: 0.7rem; }
        td { padding: 10px; border-bottom: 1px solid var(--a); font-size: 0.8rem; }
    </style>
</head>
<body data-theme="light">
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="color:var(--p)">STOCKPRO</h2>
            <input type="text" id="u" placeholder="User (admin/staff)">
            <input type="password" id="pw" placeholder="Key">
            <button class="btn btn-main" onclick="auth()">Login</button>
            <button class="btn" style="background:var(--a)" onclick="go('Guest')">Guest View</button>
            <p style="font-size:0.6rem; opacity:0.5">Admin: admin/1234 | Staff: staff/staff</p>
        </div>
    </div>
    <nav id="nb">
        <div style="color:var(--s); font-weight:800">STOCKPRO</div>
        <div style="display:flex; gap:15px">
            <div class="nav-item" onclick="nav('dash')">Home</div>
            <div class="nav-item" onclick="nav('inv')">Ledger</div>
            <div class="nav-item" onclick="nav('rep')">Reports</div>
            <div class="nav-item" onclick="dk()"><i class="fas fa-moon"></i></div>
        </div>
    </nav>
    <div class="container" id="main">
        <section id="p-dash" class="page active">
            <div class="admin-only" style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px">
                <div class="card" style="text-align:center"><small>CAPITAL</small><h2 id="v">0</h2></div>
                <div class="card" style="text-align:center"><small>ITEMS</small><h2 id="i">0</h2></div>
            </div>
            <div class="admin-only card"><canvas id="ch" style="max-height:180px"></canvas></div>
            <div class="staff-only card">
                <h3>Add Asset</h3>
                <div id="qr" style="display:none; margin-bottom:10px"></div>
                <button class="btn" style="background:var(--p); color:var(--s)" onclick="sc()">Scan Barcode</button>
                <input id="n" placeholder="Name"> <input id="q" type="number" placeholder="Qty">
                <input id="pr" type="number" placeholder="Price" class="admin-only">
                <select id="ct"><option>Hardware</option><option>Software</option><option>Materials</option></select>
                <button class="btn btn-main" onclick="add()">Commit</button>
            </div>
        </section>
        <section id="p-inv" class="page">
            <div class="card"><input placeholder="Search..." onkeyup="draw()" id="sh">
            <table><thead><tr><th>Item</th><th>Qty</th><th class="admin-only">Price</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table></div>
        </section>
        <section id="p-rep" class="page">
            <div class="card" onclick="pdf()"><h4><i class="fas fa-file-pdf"></i> Audit PDF</h4></div>
            <div class="admin-only card" onclick="csv()"><h4><i class="fas fa-file-csv"></i> Ledger CSV</h4></div>
            <button class="btn" style="background:#25D366; color:white" onclick="wa()">WhatsApp Sync</button>
        </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script>
        let db = JSON.parse(localStorage.getItem('st_db')) || [], user = 'Guest', myCh = null, qrc = null;
        function auth() {
            let userIn = document.getElementById('u').value.toLowerCase(), pwIn = document.getElementById('pw').value;
            if(userIn==='admin' && pwIn==='1234') go('Admin'); else if(userIn==='staff' && pwIn==='staff') go('Staff'); else alert('Fail');
        }
        function go(r) {
            user = r; document.getElementById('auth-overlay').style.display='none'; document.getElementById('nb').style.display='flex'; document.getElementById('main').style.display='block';
            if(r==='Admin') { document.querySelectorAll('.admin-only, .staff-only').forEach(e=>e.style.display='block'); chart(); }
            else if(r==='Staff') document.querySelectorAll('.staff-only').forEach(e=>e.style.display='block');
            upd();
        }
        function dk() { let b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); }
        function csv() {
            let c = "Item,Qty,Price\n"; db.forEach(i=>c+=`${i.name},${i.qty},${i.price}\n`);
            let b = new Blob([c],{type:'text/csv'}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='Ledger.csv'; a.click();
        }
        function pdf() { const {jsPDF}=window.jspdf; let d=new jsPDF(); d.text("Audit",10,10); d.autoTable({head:[['Item','Qty','Price']],body:db.map(i=>[i.name,i.qty,i.price])}); d.save('Audit.pdf'); }
        function add() {
            let name=document.getElementById('n').value, qty=parseInt(document.getElementById('q').value);
            if(!name || isNaN(qty)) return;
            db.push({id:Date.now(), name, qty, price:document.getElementById('pr').value||0, cat:document.getElementById('ct').value});
            localStorage.setItem('st_db', JSON.stringify(db)); upd(); if(myCh) updCh();
        }
        function draw() {
            let b=document.getElementById('tb'), s=document.getElementById('sh').value.toLowerCase(); b.innerHTML='';
            db.filter(i=>i.name.toLowerCase().includes(s)).forEach(i=>{
                b.innerHTML+=`<tr><td>${i.name}</td><td>${i.qty}</td><td class="admin-only">${i.price}</td><td>${user==='Admin'?`<i class='fas fa-trash' onclick='del(${i.id})'></i>`:''}</td></tr>`;
            });
            if(user==='Admin') document.querySelectorAll('.admin-only').forEach(e=>e.style.display='table-cell');
        }
        function del(id) { db=db.filter(i=>i.id!==id); localStorage.setItem('st_db', JSON.stringify(db)); upd(); }
        function upd() { draw(); let tot=db.reduce((s,i)=>s+(i.qty*i.price),0); document.getElementById('v').innerText=tot; document.getElementById('i').innerText=db.length; }
        function chart() { let ctx=document.getElementById('ch').getContext('2d'); myCh=new Chart(ctx,{type:'doughnut',data:{labels:['Hardware','Software','Materials'],datasets:[{data:[0,0,0],backgroundColor:['#d4af37','#1e272e','#353b48']}]}}); updCh(); }
        function updCh() { if(!myCh) return; let cats=['Hardware','Software','Materials']; myCh.data.datasets[0].data=cats.map(c=>db.filter(i=>i.cat===c).length); myCh.update(); }
        function nav(p) { document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.getElementById('p-'+p).classList.add('active'); }
        function wa() { let m='Stock Update:%0A'; db.forEach(i=>m+=i.name+': '+i.qty+'%0A'); window.open('https://wa.me/254112873218?text='+m); }
        function sc() { let r=document.getElementById('qr'); if(!qrc){r.style.display='block'; qrc=new Html5Qrcode("qr"); qrc.start({facingMode:"environment"},{fps:10,qrbox:250},(t)=>{document.getElementById('n').value=t; sc();});}else{qrc.stop().then(()=>{qrc=null;r.style.display='none';});} }
    </script>
</body>
                                  </html>
