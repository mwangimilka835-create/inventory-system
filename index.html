<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Royal Purple</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --bg: #1a1625; --card: #2d2640; --text: #eee7ff; 
            --primary: #d4af37; --secondary: #9d81ff; --danger: #ff5e5e; --accent: #3d3454;
        }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* LOGIN FIX */
        #auth-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; border-top: 4px solid var(--primary); }
        .auth-card { background: var(--card); padding: 30px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        
        /* COMPACT NAVIGATION */
        nav { background: var(--card); padding: 12px 5%; display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--accent); }
        .nav-brand { font-weight: 900; color: var(--primary); letter-spacing: 1px; }
        .nav-item { cursor: pointer; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; opacity: 0.6; }
        .nav-item.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }

        .container { max-width: 600px; margin: 1rem auto; padding: 0 15px; display: none; }
        .page { display: none; } .page.active { display: block; }

        /* REFINED CARDS */
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--accent); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--accent); background: var(--bg); color: var(--text); border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 14px; border: none; cursor: pointer; border-radius: 8px; font-weight: 700; width: 100%; transition: 0.2s; }
        .btn-main { background: var(--primary); color: #1a1625; }

        /* COMPACT CHART */
        #chart-container { height: 180px; margin-bottom: 15px; display: none; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 10px; color: var(--secondary); text-transform: uppercase; font-size: 0.65rem; border-bottom: 1px solid var(--accent); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--accent); }
        
        .low-stock { color: var(--danger); font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #1a1625; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: none; z-index: 10001; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="color:var(--primary); margin-top:0;">STOCKPRO</h2>
            <input type="text" id="u" placeholder="Username (admin/staff)">
            <input type="password" id="p" placeholder="Key (1234)">
            <button class="btn btn-main" onclick="login()">LOGIN</button>
            <p style="font-size:0.6rem; opacity:0.4; margin-top:15px;">Admin: admin | 1234</p>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-brand">STOCKPRO</div>
        <div style="display:flex; gap:15px;">
            <div class="nav-item active" onclick="tab('dash', event)">Home</div>
            <div class="nav-item" onclick="tab('inv', event)">Ledger</div>
            <div class="nav-item" onclick="tab('rep', event)">Docs</div>
        </div>
    </nav>

    <div class="container" id="app">
        <section id="p-dash" class="page active">
            <div id="adm-head" style="display:none; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                <div class="card" style="text-align:center;"><small>VALUATION</small><div id="stat-v" style="color:var(--primary); font-weight:bold;">0</div></div>
                <div class="card" style="text-align:center;"><small>ASSETS</small><div id="stat-i" style="font-weight:bold;">0</div></div>
            </div>

            <div id="chart-container" class="card"><canvas id="myChart"></canvas></div>
            
            <div class="card">
                <h4 style="margin:0 0 10px 0; color:var(--secondary)">New Entry</h4>
                <input id="n" placeholder="Item Name">
                <input id="q" type="number" placeholder="Quantity">
                <div id="adm-price" style="display:none;"><input id="pr" type="number" placeholder="Price (KES)"></div>
                <select id="c"><option>Hardware</option><option>Software</option><option>Materials</option></select>
                <button class="btn btn-main" onclick="save()">COMMIT ASSET</button>
            </div>
        </section>

        <section id="p-inv" class="page">
            <div class="card">
                <input placeholder="Quick Search..." onkeyup="render()" id="search">
                <table>
                    <thead><tr><th>Asset</th><th>Stock</th><th class="adm-only">KES</th></tr></thead>
                    <tbody id="table"></tbody>
                </table>
            </div>
        </section>

        <section id="p-rep" class="page">
            <div class="card" onclick="genPDF()" style="cursor:pointer">Audit PDF Export <i class="fas fa-file-pdf" style="float:right"></i></div>
            <button class="btn" style="background:#25D366; color:white;" onclick="waSync()">WhatsApp Update</button>
        </section>
    </div>

    <div id="toast"></div>

    <script>
        let db = JSON.parse(localStorage.getItem('milka_pro_db')) || [];
        let role = 'Guest'; let chart = null;

        function login() {
            let user = document.getElementById('u').value.trim().toLowerCase();
            let pass = document.getElementById('p').value.trim();
            if (user === 'admin' && pass === '1234') start('Admin');
            else if (user === 'staff' && pass === 'staff') start('Staff');
            else alert("Try admin / 1234");
        }

        function start(r) {
            role = r;
            document.getElementById('auth-overlay').style.display='none';
            document.getElementById('navbar').style.display='flex';
            document.getElementById('app').style.display='block';
            if(r === 'Admin') {
                document.getElementById('adm-head').style.display = 'grid';
                document.getElementById('adm-price').style.display = 'block';
                document.getElementById('chart-container').style.display = 'block';
                initChart();
            }
            refresh();
        }

        function save() {
            let name = document.getElementById('n').value, qty = parseInt(document.getElementById('q').value);
            if(!name || isNaN(qty)) return toast("Fill all fields");
            let time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            db.push({ id:Date.now(), name, qty, price:document.getElementById('pr').value||0, cat:document.getElementById('c').value, time });
            localStorage.setItem('milka_pro_db', JSON.stringify(db));
            refresh(); toast("Saved");
            document.getElementById('n').value=''; document.getElementById('q').value='';
        }

        function render() {
            let b = document.getElementById('table'), s = document.getElementById('search').value.toLowerCase();
            b.innerHTML = '';
            db.filter(i => i.name.toLowerCase().includes(s)).forEach(i => {
                b.innerHTML += `<tr>
                    <td>${i.name}<br><small style="opacity:0.4">${i.time}</small></td>
                    <td class="${i.qty < 5 ? 'low-stock' : ''}">${i.qty}</td>
                    <td style="display:${role==='Admin'?'table-cell':'none'}">${i.price}</td>
                </tr>`;
            });
        }

        function initChart() {
            const ctx = document.getElementById('myChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: ['H/W', 'S/W', 'Mat'], datasets: [{ data: [0, 0, 0], backgroundColor: '#d4af37' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#eee7ff' } }, x: { ticks: { color: '#eee7ff' } } } }
            });
            updChart();
        }

        function updChart() {
            if(!chart) return;
            chart.data.datasets[0].data = ['Hardware', 'Software', 'Materials'].map(c => db.filter(i => i.cat === c).length);
            chart.update();
        }

        function refresh() { 
            render(); 
            let v = db.reduce((s,i)=>s+(i.qty*i.price),0); 
            document.getElementById('stat-v').innerText = v.toLocaleString(); 
            document.getElementById('stat-i').innerText = db.length; 
            if(chart) updChart(); 
        }

        function tab(p, e) {
            document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
            document.getElementById('p-'+p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
            e.currentTarget.classList.add('active');
        }

        function toast(m) { let t = document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
        function waSync() { let m = 'Stock Update:%0A'; db.forEach(i=>m+=`${i.name}: ${i.qty}%0A`); window.open('https://wa.me/254700000000?text='+m); }
    </script>
</body>
                </html>
