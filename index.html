<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milka's Smart Inventory</title>
    <style>
    body { font-family: Arial, sans-serif; background-color: #f1c40f; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .header { background: #2980b9; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    .stats { display: flex; gap: 10px; margin-bottom: 20px; }
    .stat-box { flex: 1; padding: 15px; border-radius: 8px; color: white; text-align: center; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .add-btn { background: #27ae60; color: white; }
    .print-btn { background: #34495e; color: white; }
    .delete-btn { background: #e74c3c; color: white; padding: 5px 10px; width: auto; margin: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }

    /* --- THE PRINT FIX --- */
    @media print {
        /* Hide everything except the table and the header */
        body { background: white !important; padding: 0; }
        .header h1 { color: black; }
        .container { box-shadow: none; max-width: 100%; width: 100%; padding: 0; }
        
        /* Hide buttons, inputs, and the "Welcome" message */
        .add-btn, .print-btn, .delete-btn, input, select, h3, .stats, .welcome-section { 
            display: none !important; 
        }

        /* Show the table clearly */
        table { width: 100%; border: 1px solid black; }
        th, td { border: 1px solid black !important; color: black; }
    }
          </style>
</head>
<body>

<div class="header">
    <h1>Inventory Management System</h1>
</div>

<div class="container">
    <div style="border-left: 5px solid #2980b9; padding-left: 10px; margin-bottom: 20px;">
    <h2>Welcome, <span id="user-name-display">Guest</span>! 👋</h2>
    <p>Manage your business stock efficiently.</p>
    </div>

    <div class="stats">
        <div class="stat-box" style="background: #27ae60;">
            <small>Total Items</small>
            <h3 id="total-items-count">0</h3>
        </div>
        <div class="stat-box" style="background: #e67e22;">
            <small>Stock Value</small>
            <h3 id="total-value-count">KES 0</h3>
        </div>
    </div>

    <h3>Add New Product</h3>
    <input type="text" id="pName" placeholder="Product Name">
    <select id="pCategory">
        <option value="Bakery">🍞 Bakery</option>
        <option value="Dairy">🥛 Dairy</option>
        <option value="General">📦 General</option>
        <option value="Drinks">🥤 Drinks</option>
    </select>
    <input type="number" id="pQty" placeholder="Quantity">
    <input type="number" id="pPrice" placeholder="Price (KES)">

    <button class="add-btn" onclick="saveProduct()">Save Product</button>
    <button class="print-btn" onclick="window.print()">Print Inventory Report</button>

    <table id="inventory-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    // This runs as soon as the page loads
window.onload = function() {
    var name = prompt("Please enter your name to access the Inventory System:");
    
    // If they didn't type anything, call them "User"
    if (name == null || name == "") {
        name = "User";
    }
    
    // Change the text on the screen to their name
    document.getElementById("user-name-display").innerText = name;
};
    function saveProduct() {
        var name = document.getElementById("pName").value;
        var category = document.getElementById("pCategory").value;
        var qty = document.getElementById("pQty").value;
        var price = document.getElementById("pPrice").value;

        if (name === "" || qty === "" || price === "") {
            alert("Please fill all boxes!");
            return;
        }

        var table = document.getElementById("inventory-table").getElementsByTagName('tbody')[0];
        var row = table.insertRow();
        row.insertCell(0).innerHTML = name;
        row.insertCell(1).innerHTML = category;
        row.insertCell(2).innerHTML = qty;
        row.insertCell(3).innerHTML = price;
        row.insertCell(4).innerHTML = '<button class="delete-btn" onclick="removeRow(this)">Delete</button>';

        // Clear boxes
        document.getElementById("pName").value = "";
        document.getElementById("pQty").value = "";
        document.getElementById("pPrice").value = "";

        updateDashboard();
    }

    function removeRow(btn) {
        btn.parentElement.parentElement.remove();
        updateDashboard();
    }

    function updateDashboard() {
        var tbody = document.getElementById("inventory-table").getElementsByTagName('tbody')[0];
        var rows = tbody.getElementsByTagName('tr');
        var totalItems = rows.length;
        var totalValue = 0;

        for (var i = 0; i < rows.length; i++) {
            var q = parseFloat(rows[i].cells[2].innerText) || 0;
            var p = parseFloat(rows[i].cells[3].innerText) || 0;
            totalValue += (q * p);
        }

        document.getElementById("total-items-count").innerText = totalItems;
        document.getElementById("total-value-count").innerText = "KES " + totalValue.toLocaleString();
    }
</script>

</body>
</html>
